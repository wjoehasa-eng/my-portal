<!doctype html><html><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#93a1b5}iframe{border:0;display:block}</style>
</head><body><iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = parseInt(q.get('w') || '1280', 10), h = parseInt(q.get('h') || '800', 10);
var f = document.getElementById('f');
f.style.width = w + 'px'; f.style.height = h + 'px';
f.src = (q.get('u') || 'index.html') + (q.get('demo') === '1' ? '?demo=1' : '');
</script>
</body></html>
