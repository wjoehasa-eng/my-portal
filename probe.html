<!doctype html><html><head><meta charset="utf-8"><title>drop indicator probe</title>
<style>html,body{margin:0;background:#93a1b5}iframe{width:1180px;height:820px;border:0;display:block}</style>
</head><body>
<iframe id="f" src="preview.html?demo=1"></iframe>
<script>
document.getElementById('f').addEventListener('load', function () {
  var d = this.contentDocument;
  setTimeout(function () {
    var panels = d.querySelectorAll('.panel');
    if (panels[1]) panels[1].classList.add('drop-zone');
    var chips = panels[0] ? panels[0].querySelectorAll('.lk') : [];
    if (chips[1]) chips[1].classList.add('drop-before');
    if (chips[2]) chips[2].classList.add('drop-src');
    var grp = panels[0] ? panels[0].querySelector('.grp-body') : null;
    if (grp) grp.classList.add('drop-end');
    var g2 = panels[0] ? panels[0].querySelectorAll('.grp')[1] : null;
    if (g2) g2.classList.add('drop-zone');
  }, 600);
});
</script>
</body></html>
