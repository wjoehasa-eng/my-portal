<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>드래그·아이콘 자동 점검 (임시)</title>
<style>
  body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 8px; background: #101418; color: #e6edf3; }
  iframe { width: 1180px; height: 830px; border: 1px solid #333; background: #fff; }
  pre { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  .ok { color: #5ddc7a; } .ng { color: #ff7b72; }
</style>
</head>
<body>
<iframe id="f" src="./?demo=1"></iframe>
<pre id="out">준비 중…</pre>
<script>
const F = document.getElementById('f');
const OUT = document.getElementById('out');
const report = { cases: [], icons: [], errors: [] };
window.__report = report;
window.__done = false;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const D = () => F.contentDocument;
const W = () => F.contentWindow;

function loadFrame() {
  return new Promise(res => {
    let done = false;
    F.onload = () => { if (done) return; done = true; setTimeout(res, 400); };
    F.src = './?demo=1&n=' + Date.now();
  });
}

function tiles() { return Array.from(D().querySelectorAll('.solo, .lk')); }
function tile(name) {
  return tiles().find(t => {
    const nm = t.querySelector('.nm');
    return nm && nm.textContent.trim() === name;
  }) || null;
}
function groupHead(cat, g) {
  return D().querySelector('.grp[data-cat="' + cat + '"][data-group="' + g + '"] .grp-head');
}
function structure(cat) {
  const p = Array.from(D().querySelectorAll('.panel')).find(x => x.dataset.cat === cat);
  if (!p) return '(패널 없음)';
  const list = p.querySelector('.plist');
  const parts = [];
  const direct = [];
  for (const ch of list.children) {
    if (ch.classList.contains('lk')) direct.push(ch.querySelector('.nm').textContent.trim());
    else if (ch.classList.contains('grp')) {
      const g = ch.querySelector('.gname').textContent.trim();
      const items = Array.from(ch.querySelectorAll('.grp-body > .lk')).map(t => t.querySelector('.nm').textContent.trim());
      parts.push(direct.length ? '[' + direct.splice(0).join(', ') + ']' : '∅');
      parts.push('[' + g + ': ' + items.join(', ') + ']');
    } else if (ch.classList.contains('empty-msg')) {
      parts.push('(빈 안내)');
    }
  }
  if (direct.length) parts.push('[' + direct.join(', ') + ']');
  return parts.join(' | ') || '(비어 있음)';
}
function soloOrder() {
  return Array.from(D().querySelectorAll('.solo-strip .solo')).map(t => t.querySelector('.nm').textContent.trim()).join(', ') || '(없음)';
}

function pev(type, x, y) {
  return new (W().PointerEvent)(type, {
    bubbles: true, cancelable: true, composed: true,
    clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: 0, buttons: type === 'pointerup' ? 0 : 1
  });
}
function fire(type, x, y) {
  const el = D().elementFromPoint(x, y) || D().body;
  el.dispatchEvent(pev(type, x, y));
  return el;
}
function pt(el, fx, fy) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width * fx, y: r.top + r.height * fy };
}

async function drag(srcEl, tx, ty) {
  const r = srcEl.getBoundingClientRect();
  const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
  fire('pointerdown', sx, sy);
  await sleep(24);
  fire('pointermove', sx + 9, sy + 2);
  await sleep(24);
  const steps = 10;
  for (let i = 1; i <= steps; i++) {
    fire('pointermove', sx + (tx - sx) * i / steps, sy + (ty - sy) * i / steps);
    await sleep(18);
  }
  await sleep(40);
  const lineEl = D().querySelector('#dropLine');
  const badgeEl = D().querySelector('#dropBadge');
  const mark = {
    dragging: D().documentElement.contains ? D().documentElement.classList.contains('dragging') : null,
    ghost: !!D().querySelector('.drag-ghost'),
    badge: badgeEl ? (badgeEl.textContent || '').trim() : '',
    line: lineEl ? (lineEl.className || '') : '',
    lineShown: lineEl ? (lineEl.style.display || '') : '',
    lineRect: lineEl ? (() => { const b = lineEl.getBoundingClientRect(); return [Math.round(b.left), Math.round(b.top), Math.round(b.width), Math.round(b.height)]; })() : null,
    dropInto: D().querySelectorAll('.drop-into').length
  };
  fire('pointerup', tx, ty);
  await sleep(420);
  mark.toast = Array.from(D().querySelectorAll('#toasts *')).map(x => x.textContent.trim()).filter(Boolean).join(' / ');
  return mark;
}

/** 탭을 한 번 돌려 state.data에서 다시 그린 결과가 같은지(데이터 순서 검증) */
async function dataOrder(cat) {
  const cats = ['업무', '학습', '도구', '커뮤니티', '개인'];
  const tab = (name) => {
    const el = D().querySelector('.tab[data-tab="' + name + '"]');
    if (el) el.click();
  };
  tab(cat);
  await sleep(60);
  const only = structure(cat);
  tab(cat); // 같은 탭 다시 = 전체로
  await sleep(60);
  return only;
}

async function runCase(c) {
  await loadFrame();
  const before = structure(c.cat);
  let mark = {};
  if (c.kind === 'grp') {
    const h = groupHead(c.cat, c.from);
    const t = groupHead(c.cat, c.to);
    const p = pt(t, 0.5, c.where === 'before' ? 0.12 : 0.5);
    mark = await drag(h, p.x, p.y);
  } else {
    const s = tile(c.from);
    let t;
    if (c.to) t = tile(c.to);
    else t = D().querySelector('.panel[data-cat="' + c.cat + '"] .plist');
    const p = c.to ? pt(t, c.where === 'before' ? 0.18 : 0.82, 0.5) : pt(t, 0.7, 0.55);
    mark = await drag(s, p.x, p.y);
  }
  const after = structure(c.cat);
  const again = await dataOrder(c.cat);
  return {
    id: c.id, desc: c.desc, expect: c.expect,
    before, after, again,
    pass: after === c.expect,
    dataPass: again === after,
    mark
  };
}

const CASES = [
  { id: 'D1', desc: '도구: 노션 → 깃허브 왼쪽', cat: '도구', from: '노션', to: '깃허브', where: 'before', expect: '[챗봇, 노션, 깃허브, 날씨]' },
  { id: 'D2', desc: '도구: 챗봇 → 날씨 오른쪽(=맨 끝)', cat: '도구', from: '챗봇', to: '날씨', where: 'after', expect: '[깃허브, 노션, 날씨, 챗봇]' },
  { id: 'D3', desc: '학습: 번역 → 유튜브 왼쪽(소그룹 안)', cat: '학습', from: '번역', to: '유튜브', where: 'before', expect: '[위키백과] | [교재·자료: 번역, 유튜브]' },
  { id: 'D4', desc: '학습: 유튜브 → 번역 오른쪽(소그룹 안)', cat: '학습', from: '유튜브', to: '번역', where: 'after', expect: '[위키백과] | [교재·자료: 번역, 유튜브]' },
  { id: 'D5', desc: '업무: 드라이브(직속) → 슬랙 오른쪽(소그룹으로)', cat: '업무', from: '드라이브', to: '슬랙', where: 'after', expect: '[수업 준비: 슬라이드] | [행정·공문: 지메일, 슬랙, 드라이브]' },
  { id: 'D6', desc: '업무: 지메일(소그룹) → 드라이브 오른쪽(소그룹 밖으로)', cat: '업무', from: '지메일', to: '드라이브', where: 'after', expect: '[드라이브, 지메일] | [수업 준비: 슬라이드] | [행정·공문: 슬랙]' },
  { id: 'D7', desc: '업무: 소그룹 순서 — 행정·공문을 수업 준비 앞으로', cat: '업무', kind: 'grp', from: '행정·공문', to: '수업 준비', where: 'before', expect: '[드라이브] | [행정·공문: 지메일, 슬랙] | [수업 준비: 슬라이드]' },
  { id: 'D8', desc: '도구: 챗봇 → 패널 빈 곳(오른쪽 아래)', cat: '도구', from: '챗봇', to: null, expect: '[깃허브, 노션, 날씨, 챗봇]' },
  { id: 'D9', desc: '개인: 넷플릭스 → 네이버 왼쪽', cat: '개인', from: '넷플릭스', to: '네이버', where: 'before', expect: '[넷플릭스, 네이버, 쿠팡]' },
  { id: 'D10', desc: '개인: 네이버 → 쿠팡 오른쪽(가운데)', cat: '개인', from: '네이버', to: '쿠팡', where: 'after', expect: '[쿠팡, 네이버, 넷플릭스]' }
];

/* ---------------------------------------------------------------- 아이콘 */
function openEditFor(name) {
  const btnEdit = D().querySelector('#btnEdit');
  if (btnEdit && !D().body.classList.contains('editing')) btnEdit.click();
  const t = tile(name);
  if (!t) return false;
  const eb = t.querySelector('[data-act="edit"]');
  if (!eb) return false;
  eb.click();
  return true;
}
function pngFile() {
  return fetch('./test-icon.png').then(r => r.blob()).then(b => new File([b], 'test-icon.png', { type: 'image/png' }));
}
function pasteWith(file) {
  const dt = new (W().DataTransfer)();
  if (file) dt.items.add(file);
  else dt.setData('text/plain', '그냥 글자 붙여넣기');
  const ev = new (W().ClipboardEvent)('paste', { bubbles: true, cancelable: true, clipboardData: dt });
  const target = D().activeElement || D().body;
  const notPrevented = target.dispatchEvent(ev);
  return { notPrevented, defaultPrevented: ev.defaultPrevented };
}

async function iconCase(id, desc, fn) {
  await loadFrame();
  const r = await fn();
  r.id = id; r.desc = desc;
  report.icons.push(r);
  return r;
}

async function runIcons() {
  /* I1: 이미지 주소 입력 → 미리보기 → 저장 → 타일에 표시 */
  await iconCase('I1', '이미지 주소 입력 → 미리보기/저장/타일 표시', async () => {
    if (!openEditFor('챗봇')) return { pass: false, why: '모달 열기 실패' };
    await sleep(120);
    const url = location.href.replace(/check\.html.*$/, '') + 'test-icon.png';
    const inp = D().querySelector('#mImgUrl');
    inp.value = url;
    inp.dispatchEvent(new (W().Event)('input', { bubbles: true }));
    await sleep(120);
    const pv = D().querySelector('#mIconPrev img');
    const prevOK = !!pv && pv.getAttribute('src') === url;
    D().querySelector('#mSave').click();
    await sleep(300);
    const t = tile('챗봇');
    const img = t && t.querySelector('.ico img.uv');
    return {
      url, prevOK,
      tileImg: img ? img.getAttribute('src') : null,
      loaded: img ? (img.naturalWidth > 0 && img.classList.contains('on')) : false,
      pass: prevOK && !!img && img.getAttribute('src') === url && img.naturalWidth > 0
    };
  });

  /* I2: 클립보드 이미지 붙여넣기(Ctrl+V) */
  await iconCase('I2', '클립보드 이미지 붙여넣기 → data URL 저장', async () => {
    if (!openEditFor('노션')) return { pass: false, why: '모달 열기 실패' };
    await sleep(120);
    const f = await pngFile();
    const r = pasteWith(f);
    await sleep(600);
    const pv = D().querySelector('#mIconPrev img');
    const note = (D().querySelector('#mImgNote') || {}).textContent || '';
    const durl = pv ? pv.getAttribute('src') : '';
    D().querySelector('#mSave').click();
    await sleep(300);
    const t = tile('노션');
    const img = t && t.querySelector('.ico img.uv');
    return {
      prevented: r.defaultPrevented, previewIsData: /^data:image\//.test(durl), durlLen: durl.length, note,
      tileIsData: img ? /^data:image\//.test(img.getAttribute('src')) : false,
      tileLen: img ? img.getAttribute('src').length : 0,
      loaded: img ? (img.naturalWidth > 0 && img.classList.contains('on')) : false,
      pass: r.defaultPrevented && /^data:image\//.test(durl) && durl.length <= 9000 && !!img && img.getAttribute('src') === durl && img.naturalWidth > 0
    };
  });

  /* I3: 글자 붙여넣기는 가로채지 않음 */
  await iconCase('I3', '글자 붙여넣기는 그대로 통과', async () => {
    if (!openEditFor('깃허브')) return { pass: false, why: '모달 열기 실패' };
    await sleep(120);
    const nm = D().querySelector('#mName');
    nm.focus();
    const r = pasteWith(null);
    return { prevented: r.defaultPrevented, pass: r.defaultPrevented === false };
  });

  /* I4: 잘못된 이미지 주소 → 키워드 이모지 폴백 */
  await iconCase('I4', '잘못된 이미지 주소 → 이모지 폴백', async () => {
    if (!openEditFor('날씨')) return { pass: false, why: '모달 열기 실패' };
    await sleep(120);
    const inp = D().querySelector('#mImgUrl');
    inp.value = 'https://no-such-host.invalid/x.png';
    inp.dispatchEvent(new (W().Event)('input', { bubbles: true }));
    D().querySelector('#mSave').click();
    await sleep(900);
    const t = tile('날씨');
    const img = t && t.querySelector('.ico img.uv');
    const em = t && t.querySelector('.ico .em');
    return {
      imgGone: !img, emoji: em ? em.textContent : null,
      pass: !img && !!em && !!em.textContent.trim()
    };
  });
}

/* ---------------------------------------------------------------- main */
(async () => {
  try {
    for (const c of CASES) {
      try { report.cases.push(await runCase(c)); }
      catch (e) { report.errors.push(c.id + ': ' + (e && e.message)); }
    }
    try { await runIcons(); }
    catch (e) { report.errors.push('icons: ' + (e && e.message)); }
  } catch (e) {
    report.errors.push('main: ' + (e && e.message));
  }
  window.__done = true;
  const lines = [];
  lines.push('== 순서 이동 ==');
  report.cases.forEach(c => {
    lines.push((c.pass ? 'PASS ' : 'FAIL ') + c.id + ' ' + c.desc);
    lines.push('   before: ' + c.before);
    lines.push('   after : ' + c.after);
    lines.push('   expect: ' + c.expect + (c.dataPass ? '  [데이터 재렌더 동일]' : '  [데이터 재렌더 다름: ' + c.again + ']'));
    lines.push('   mark  : line=' + c.mark.line + ' shown=' + c.mark.lineShown + ' ghost=' + c.mark.ghost + ' badge=' + c.mark.badge + ' toast=' + (c.mark.toast || ''));
  });
  lines.push('== 아이콘 ==');
  report.icons.forEach(c => lines.push((c.pass ? 'PASS ' : 'FAIL ') + c.id + ' ' + c.desc + ' :: ' + JSON.stringify(c)));
  if (report.errors.length) lines.push('== 오류 == ' + report.errors.join(' | '));
  OUT.textContent = lines.join('\n');
  document.title = 'done ' + report.cases.filter(c => c.pass).length + '/' + report.cases.length + ' icons ' + report.icons.filter(c => c.pass).length + '/' + report.icons.length;
})();
</script>
</body>
</html>
