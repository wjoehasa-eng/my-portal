<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>우클릭 메뉴 점검 (임시)</title>
<style>body{font:13px/1.4 system-ui,sans-serif;margin:0;padding:6px;background:#101418;color:#ddd}iframe{width:1180px;height:900px;border:1px solid #333;background:#fff}pre{font:12px ui-monospace,monospace;white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" src="./?demo=1"></iframe>
<pre id="out">준비…</pre>
<script>
const F = document.getElementById('f');
const OUT = document.getElementById('out');
const D = () => F.contentDocument;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const target = new URLSearchParams(location.search).get('t') || 'cat';

async function go() {
  await sleep(700);
  let el;
  if (target === 'cat') {
    el = D().querySelector('.panel[data-cat="업무"] .plist');
  } else {
    el = D().querySelector('.panel[data-cat="업무"] .lk');
  }
  if (!el) { OUT.textContent = 'target 없음'; return; }
  const r = el.getBoundingClientRect();
  const x = target === 'cat' ? r.left + 40 : r.left + r.width / 2;
  const y = target === 'cat' ? r.top + 4 : r.top + r.height / 2;
  el.dispatchEvent(new (F.contentWindow.MouseEvent)('contextmenu', { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 2 }));
  await sleep(250);
  const m = D().querySelector('#ctxMenu');
  const items = m ? Array.from(m.querySelectorAll('.ci')).map(b => b.textContent.trim()) : [];
  OUT.textContent = 'menu=' + (m && !m.classList.contains('hidden')) + ' items=' + JSON.stringify(items);
  document.title = 'menu ' + (items.length ? 'ok' : 'none');
}
F.addEventListener('load', go);
</script>
</body>
</html>
