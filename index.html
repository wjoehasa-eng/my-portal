<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#eef1f7" />
<meta name="portal-version" content="3.0.0" />
<title>나만의 포털</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#eef1f8; --panel:#fff; --panel2:#f5f7fc; --txt:#0d1526; --mut:#5f6d85;
    --line:#e3e8f1; --acc:#3b5bfd; --acc2:#7c4dff; --acc-ink:#fff; --acc-soft:#eaefff;
    --danger:#e5484d; --ok:#0e9f86;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 8px -4px rgba(16,24,40,.10);
    --shadow:0 2px 4px rgba(16,24,40,.04), 0 18px 32px -22px rgba(16,24,40,.34);
    --r:18px; --r-sm:12px;
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#080b11; --panel:#121823; --panel2:#171f2c; --txt:#e9eff9; --mut:#94a4bb;
      --line:#222c3c; --acc:#7aa2ff; --acc2:#a78bfa; --acc-ink:#08111f; --acc-soft:#18233a;
      --danger:#ff6b6b; --ok:#2ec4b6;
      --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.6);
      --shadow:0 2px 4px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.95);
    }
  }
  html[data-theme="light"]{
    --bg:#eef1f8; --panel:#fff; --panel2:#f5f7fc; --txt:#0d1526; --mut:#5f6d85;
    --line:#e3e8f1; --acc:#3b5bfd; --acc2:#7c4dff; --acc-ink:#fff; --acc-soft:#eaefff;
    --danger:#e5484d; --ok:#0e9f86;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 8px -4px rgba(16,24,40,.10);
    --shadow:0 2px 4px rgba(16,24,40,.04), 0 18px 32px -22px rgba(16,24,40,.34);
  }
  html[data-theme="dark"]{
    --bg:#080b11; --panel:#121823; --panel2:#171f2c; --txt:#e9eff9; --mut:#94a4bb;
    --line:#222c3c; --acc:#7aa2ff; --acc2:#a78bfa; --acc-ink:#08111f; --acc-soft:#18233a;
    --danger:#ff6b6b; --ok:#2ec4b6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.6);
    --shadow:0 2px 4px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.95);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1100px 420px at 50% -160px, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  body.disconnected .searchbox,body.disconnected #btnEdit{display:none !important}
  body.disconnected .editbar{display:none !important}
  .wrap{max-width:1340px;margin:0 auto;padding:0 18px}
  @media (max-width:640px){ .wrap{padding:0 12px} }

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb, var(--line) 80%, transparent)}
  .top-in{display:flex;align-items:center;gap:12px;height:62px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .logo{font-size:21px;line-height:1}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 10px 0 14px;height:42px;max-width:540px;box-shadow:var(--shadow-sm);transition:border-color .15s, box-shadow .15s}
  .searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
  .searchbox .mag{opacity:.5;font-size:14px}
  .searchbox input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:14.5px}
  .searchbox input::placeholder{color:var(--mut)}
  .searchbox kbd{font:inherit;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel2)}
  .tools{display:flex;align-items:center;gap:7px;margin-left:auto}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:0 10px;height:30px;border-radius:999px;white-space:nowrap}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.45}
  .status.saving .dot{background:var(--acc);opacity:1;animation:pulse 1s infinite}
  .status.syncing .dot{background:var(--acc2);opacity:1;animation:pulse 1.1s infinite}
  .status.editing{color:var(--acc);background:var(--acc-soft)}
  .status.editing .dot{background:var(--acc);opacity:1}
  .status.saved{color:var(--ok)}
  .status.saved .dot{background:var(--ok);opacity:1}
  .status.error{color:var(--danger);cursor:pointer}
  .status.error .dot{background:var(--danger);opacity:1}
  @keyframes pulse{0%,100%{transform:scale(.78);opacity:.5}50%{transform:scale(1.2);opacity:1}}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:15px;box-shadow:var(--shadow-sm);transition:background .15s,transform .06s}
  .icon-btn:hover{background:var(--panel2)}
  .icon-btn:active{transform:scale(.96)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .06s}
  .btn:hover{background:var(--panel2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink);box-shadow:0 6px 16px -10px var(--acc)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
  .btn.danger{color:var(--danger)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}

  /* ---------- banner ---------- */
  .banner{margin:14px 0 0;display:flex;align-items:center;gap:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb, var(--acc) 28%, transparent);color:var(--txt);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}
  .banner .b-txt{flex:1}

  /* ---------- edit bar ---------- */
  .editbar{position:sticky;top:62px;z-index:35;margin:14px 0 0}
  .eb-in{display:flex;align-items:center;gap:12px;border-radius:14px;padding:11px 14px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--panel)),color-mix(in srgb,var(--acc2) 12%,var(--panel)));
    border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:var(--shadow)}
  .eb-ico{font-size:20px;line-height:1}
  .eb-txt{flex:1;min-width:0;font-size:13.5px;font-weight:650}
  .eb-txt b{font-weight:800}
  .eb-sub{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-top:2px}
  .eb-act{display:flex;gap:8px;flex:none}

  /* ---------- pins ---------- */
  .pinbar{display:flex;align-items:center;gap:12px;margin:20px 0 2px}
  .pins-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.3px;flex:none}
  .pins{display:flex;gap:10px;overflow-x:auto;padding:2px;flex:1;scrollbar-width:none}
  .pins::-webkit-scrollbar{display:none}
  .pin{display:flex;align-items:center;gap:10px;height:60px;padding:0 20px 0 16px;flex:none;
    background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 10%,var(--panel)),var(--panel) 70%);
    border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line));border-radius:16px;box-shadow:var(--shadow-sm);
    font-weight:750;font-size:15.5px;letter-spacing:-.3px;white-space:nowrap;
    transition:transform .12s,box-shadow .18s,border-color .18s}
  .pin .pi{font-size:22px;line-height:1}
  .pin:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--acc) 55%,var(--line));box-shadow:0 12px 26px -16px color-mix(in srgb,var(--acc) 70%,transparent)}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:16px;margin:16px 0 8px;align-items:start}
  #root{display:block}
  .panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden;transition:box-shadow .18s,border-color .18s,transform .18s}
  .panel::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c,var(--acc));opacity:.95}
  .panel:hover{box-shadow:var(--shadow)}
  .ph{display:flex;align-items:center;gap:8px;padding:15px 10px 9px 8px;position:relative}
  .ph h2{font-size:15.5px;font-weight:800;letter-spacing:-.35px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;padding-right:2px}
  .pdot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--acc));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--acc)) 16%,transparent);flex:none}
  .cnt{font-size:11.5px;font-weight:800;color:var(--c,var(--acc));background:color-mix(in srgb, var(--c,var(--acc)) 12%, transparent);border-radius:999px;padding:2px 8px;flex:none;line-height:1.5}
  .collapser{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--txt);flex:none;transition:background .12s,color .12s,border-color .12s,transform .06s}
  .collapser:hover{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 55%,var(--line));color:var(--acc)}
  .collapser:active{transform:scale(.93)}
  .cat-grip{width:18px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--mut);opacity:.3;cursor:grab;flex:none;touch-action:none;user-select:none}
  .ph:hover .cat-grip{opacity:.8}
  .open-mini{width:28px;height:28px;border-radius:8px;font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;opacity:.7;border:1px solid transparent;transition:opacity .12s,background .12s,border-color .12s,color .12s}
  .open-mini:hover{opacity:1;background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--acc)}
  .add-mini{width:28px;height:28px;border-radius:8px;font-size:15px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;opacity:0;transition:opacity .12s,background .12s}
  .panel:hover .add-mini{opacity:1}
  .add-mini:hover{background:var(--panel2);color:var(--txt)}
  .plist{padding:0 8px 10px;display:flex;flex-direction:column;gap:4px}
  .lk{display:flex;align-items:center;gap:10px;height:50px;padding:0 9px;border-radius:12px;position:relative;
    border:1px solid transparent;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    transition:background .12s,border-color .12s}
  .lk:hover{background:var(--panel2);border-color:var(--line)}
  .lk:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .lk .ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;
    background:color-mix(in srgb, var(--c,var(--acc)) 11%, transparent);flex:none}
  .lk .nm{font-size:15px;font-weight:650;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .grp-body .lk{height:46px}
  .grp-body .lk .ico{width:31px;height:31px;font-size:17px;border-radius:10px}
  .grp-body .lk .nm{font-size:14.5px}
  .lk .go{font-size:12px;color:var(--mut);opacity:0;transition:opacity .12s;flex:none}
  .lk:hover .go{opacity:.6}
  .lk.drop-src{opacity:.28;border-style:dashed;border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:var(--acc-soft)}
  .panel.drop-src{opacity:.45;border-style:dashed;border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
  .plist .empty-msg{font-size:12.5px;color:var(--mut);padding:16px 8px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;margin:2px}
  .panel.is-collapsed .plist,.panel.is-collapsed .ed-head,.panel.is-collapsed .add-group{display:none}
  .panel.is-collapsed .ph{padding-bottom:15px}

  /* ---------- 소그룹(하위 층위) ---------- */
  .grp{position:relative}
  .grp+.grp{margin-top:7px}
  .plist>.grp:first-child{margin-top:2px}
  .grp-head{display:flex;align-items:center;gap:5px;width:100%;padding:4px 6px 4px 4px;border-radius:10px;text-align:left;
    background:color-mix(in srgb, var(--c,var(--acc)) 7%, var(--panel2));
    border:1px dashed color-mix(in srgb, var(--c,var(--acc)) 24%, var(--line));
    font-size:11.5px;font-weight:800;letter-spacing:.1px;
    color:color-mix(in srgb, var(--c,var(--acc)) 62%, var(--txt));
    transition:background .12s,border-color .12s;user-select:none;-webkit-user-select:none;cursor:grab;touch-action:pan-y}
  .grp-head:hover{background:color-mix(in srgb, var(--c,var(--acc)) 13%, var(--panel2));border-color:color-mix(in srgb, var(--c,var(--acc)) 45%, var(--line))}
  .grp-head .gchev-btn{width:28px;height:28px;border-radius:8px;border:1px solid color-mix(in srgb,var(--c,var(--acc)) 26%,var(--line));background:color-mix(in srgb,var(--panel) 72%,transparent);font-size:11px;font-weight:800;color:inherit;display:flex;align-items:center;justify-content:center;flex:none;transition:background .12s,border-color .12s}
  .grp-head .gchev-btn:hover{background:color-mix(in srgb,var(--acc) 16%,var(--panel));border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
  .grp-head .gname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;cursor:text}
  .grp-head .gcnt{font-size:10.5px;font-weight:800;opacity:.7;flex:none}
  .grp-head .gbtn{width:24px;height:24px;border-radius:6px;font-size:11px;opacity:.55;display:flex;align-items:center;justify-content:center;flex:none}
  .grp-head .gbtn:hover{opacity:1;background:color-mix(in srgb,var(--txt) 8%,transparent)}
  .grp-head .gbtn.gopen{opacity:.7;font-size:12px}
  .grp-head .gbtn.gopen:hover{color:var(--acc);background:var(--acc-soft)}
  .grp-head .gbtn.del:hover{color:var(--danger)}
  .grp.drop-into .grp-head{border-style:solid;border-color:var(--acc);background:var(--acc-soft);color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
  .grp-body{display:flex;flex-direction:column;gap:3px;padding:3px 0 3px 9px;margin-left:7px;
    border-left:2px solid color-mix(in srgb, var(--c,var(--acc)) 18%, transparent)}
  .grp.drop-src{opacity:.4}
  .grp-body:empty{min-height:6px}
  body.editing .grp-body:empty{min-height:30px;border-left-color:color-mix(in srgb, var(--c,var(--acc)) 30%, transparent);border-radius:0 8px 8px 0;background:color-mix(in srgb, var(--c,var(--acc)) 3%, transparent)}
  .grp.is-collapsed .grp-body{display:none}
  .grp.is-collapsed .grp-head{margin-bottom:0}
  .grp-head.drop-end{box-shadow:inset 0 -4px 0 var(--acc), 0 0 12px color-mix(in srgb,var(--acc) 45%,transparent)}
  .grp-body.drop-end::after{content:"";display:block;height:4px;border-radius:4px;margin-top:2px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent)}
  .grp.drop-zone .grp-head{border-style:solid;border-color:color-mix(in srgb,var(--acc) 65%,var(--line));background:var(--acc-soft);color:var(--acc)}
  .add-group{display:flex;align-items:center;justify-content:center;gap:5px;width:calc(100% - 20px);margin:2px 10px 10px;height:32px;border-radius:9px;
    border:1.5px dashed color-mix(in srgb,var(--c,var(--acc)) 30%,var(--line));color:var(--mut);font-size:12px;font-weight:700}
  .add-group:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
  body.editing .panel{border-color:color-mix(in srgb, var(--acc) 26%, var(--line))}
  body.editing .lk:hover{background:color-mix(in srgb, var(--acc) 6%, var(--panel2))}
  body.editing .lk{cursor:grab}

  /* edit head */
  .ed-head{display:flex;align-items:center;gap:6px;padding:0 10px 10px}
  .ph input.cat-name{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:9px;height:30px;padding:0 9px;font-size:14px;font-weight:750}
  .ph input.cat-name:focus{outline:0;border-color:var(--acc);background:var(--panel);box-shadow:0 0 0 3px var(--acc-soft)}
  .dots{display:flex;gap:5px;align-items:center}
  .dots button{width:16px;height:16px;border-radius:50%;border:2px solid transparent;background:var(--dc);transition:transform .08s}
  .dots button:hover{transform:scale(1.2)}
  .dots button.on{border-color:var(--txt);box-shadow:0 0 0 1px var(--panel) inset}
  .ed-head .spacer{flex:1}
  .ed-head .mini{height:28px;min-width:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .ed-head .mini:hover{background:var(--panel2)}
  .ed-head .mini.danger{color:var(--danger)}
  .ed-head .mini:disabled{opacity:.35}
  .ctools{display:flex;gap:1px;flex:none;margin-left:2px}
  .ctools button{width:30px;height:30px;border-radius:8px;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.7}
  .ctools button:hover{background:color-mix(in srgb,var(--txt) 8%,transparent);opacity:1}
  .ctools button.on{opacity:1;background:color-mix(in srgb,var(--acc) 16%,transparent)}
  .ctools button.del:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,transparent)}

  /* ---------- drop indicators ---------- */
  .lk.drop-before::before,.lk.drop-after::after{
    content:"";position:absolute;left:2px;right:2px;height:4px;border-radius:4px;z-index:5;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent);
  }
  .lk.drop-before::before{top:-3px}
  .lk.drop-after::after{bottom:-3px}
  .lk.drop-before::after,.lk.drop-after::before{content:none}
  .lk.drop-before,.lk.drop-after{z-index:2}
  .plist.drop-end{position:relative}
  .plist.drop-end::after{
    content:"";position:absolute;left:10px;right:10px;bottom:4px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent);
  }
  .panel.drop-zone{border-color:color-mix(in srgb,var(--acc) 65%,var(--line));background:color-mix(in srgb,var(--acc) 4%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent),var(--shadow)}
  .panel.cat-before{box-shadow:inset 4px 0 0 var(--acc), 0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .panel.cat-after{box-shadow:inset -4px 0 0 var(--acc), 0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .drag-ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;display:flex;align-items:center;gap:10px;
    height:50px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));
    box-shadow:0 18px 36px -16px rgba(16,24,40,.55), 0 0 0 4px color-mix(in srgb,var(--acc) 12%,transparent);
    font-weight:700;font-size:15px;transform-origin:center;will-change:transform;opacity:.97}

<body>

    ]
  };

  /* ---------------------------------------------------------------- remote */
  var queue = Promise.resolve();

  function jsonp(params) {
    var run = queue.then(function () { return jsonpRaw(params); });
    queue = run.catch(function () {});
    return run;
  }

  function jsonpRaw(params) {
    return new Promise(function (resolve, reject) {
      var name = '__portalCb';
      var q = [];
      Object.keys(params).forEach(function (k) {
        if (params[k] === undefined || params[k] === null) return;
        q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
      });
      q.push('callback=' + name);
      var script = document.createElement('script');
      var done = false;
      var timer = setTimeout(function () { finish(); reject(new Error('시간 초과 — 응답이 없습니다.')); }, 20000);

      function finish() {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[name] = function (data) { finish(); resolve(data); };
      script.onerror = function () { finish(); reject(new Error('연결하지 못했습니다. 주소와 배포 권한(모든 사용자)을 확인하세요.')); };
      script.src = state.url + (state.url.indexOf('?') >= 0 ? '&' : '?') + q.join('&');
      document.head.appendChild(script);
    });
  }

  /** 쓰기: text/plain POST → 숨은 폼 POST(결과 확인 포함) → JSONP GET 순으로 시도합니다. */
  function saveRemote(payload) {
    return postFetch(payload).catch(function (firstErr) {
      return formPost(payload).then(function () {
        return jsonp({ action: 'load' }).then(function (d) {
          if (sameLinks(d, payload)) return d;
          throw new Error('저장 확인 실패');
        });
      }).catch(function () {
        var body = JSON.stringify(payload);
        if (encodeURIComponent(body).length > 5500) throw firstErr;
        return jsonp({ action: 'saveAll', d: body });
      });
    }).then(function (data) {
      if (data && data.ok === false) throw new Error(data.error || '저장에 실패했습니다.');
      return data;
    });
  }

  function postFetch(payload) {
    return fetch(state.url, {
      method: 'POST', mode: 'cors', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (text) {
      var data = JSON.parse(text);
      if (!data || data.ok === false) throw new Error((data && data.error) || '저장에 실패했습니다.');
      return data;
    });
  }

  /** 응답을 읽을 수 없는 환경을 위한 숨은 폼 전송(성공 여부는 따로 확인). */
  function formPost(payload) {
    return new Promise(function (resolve, reject) {
      var name = 'pf' + Date.now();
      var iframe = document.createElement('iframe');
      iframe.name = name;
      iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      var form = document.createElement('form');
      form.method = 'POST'; form.action = state.url; form.target = name; form.style.display = 'none';
      var input = document.createElement('input');
      input.type = 'hidden'; input.name = 'payload'; input.value = JSON.stringify(payload);
      form.appendChild(input);
      document.body.appendChild(iframe);
      document.body.appendChild(form);

      var done = false;
      var timer = setTimeout(function () { end(new Error('응답 없음')); }, 20000);
      function end(err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (form.parentNode) form.parentNode.removeChild(form);
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        if (err) reject(err); else resolve({ ok: true });
      }
      iframe.onload = function () { setTimeout(function () { end(null); }, 60); };
      form.submit();
    });
  }

  function sameLinks(data, payload) {
    if (!data || !data.links) return false;
    var a = data.links.map(function (l) { return [l.category, l.name, l.url, l.pin ? 'Y' : 'N'].join('|'); });
    var b = (payload.links || []).map(function (l) { return [l.c, l.n, l.u, l.p].join('|'); });
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  /* ---------------------------------------------------------------- cache */
  function cacheKey() { return state.demo || !state.url ? '' : LS.cache + hashKey(state.url); }
  function collKey() { if (state.demo) return LS.collapsed + 'demo'; return !state.url ? '' : LS.collapsed + hashKey(state.url); }

  function readCache() {
    var k = cacheKey();
    if (!k) return null;
    try {
      var s = localStorage.getItem(k);
      if (!s) return null;
      var d = JSON.parse(s);
      if (!d || !d.links) return null;
      return d;
    } catch (e) { return null; }
  }

  function writeCache(d) {
    var k = cacheKey();
    if (!k || !d) return;
    try {
      localStorage.setItem(k, JSON.stringify({
        portalTitle: d.title, theme: d.theme, sheetUrl: state.sheetUrl,
        collapsed: d.collapsed, collapsedGroups: d.collapsedGroups,
        categories: d.cats.map(function (c) { return { name: c.name, color: c.color, groups: c.groups || [] }; }),
        links: d.links.map(function (l) {
          return { category: l.cat, group: l.group || '', name: l.name, icon: l.icon, url: l.url, desc: l.desc, pin: l.pin ? 'Y' : 'N' };
        }),
        cachedAt: Date.now()
      }));
    } catch (e) {}
  }

  function persistCollapsed() {
    var k = collKey();
    if (k) lsSet(k, JSON.stringify((state.data && state.data.collapsed) || []));
  }

  /** 접힘 상태만 시트 설정에 바로 저장합니다(내용 편집과 무관). */
  function savePrefs() {
    if (state.demo || !state.url || !state.data) return;
    if (state.backendOld) return;
    var body = {
      collapsed: (state.data.collapsed || []).slice(),
      collapsedGroups: (state.data.collapsedGroups || []).slice()
    };
    jsonp({ action: 'setSettings', d: JSON.stringify(body) }).catch(function () {});
  }

  /* ---------------------------------------------------------------- boot */
  function boot() {
    var ltheme = lsGet(LS.theme);
    if (ltheme) document.documentElement.setAttribute('data-theme', ltheme);

    var qs = location.search.replace(/^\?/, '');
    var params = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      params[decodeURIComponent(kv.slice(0, i < 0 ? kv.length : i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
    });

    var hash = location.hash.replace(/^#/, '');
    var conn = '';
    if (/^s=/.test(hash)) {
      var v = hash.slice(2);
      conn = /^https?:/i.test(v) ? v : b64decode(v);
    } else if (hash && /^https?:/i.test(hash)) {
      conn = hash;
    } else if (params.s) {
      conn = params.s;
    }

    if (params.demo === '1') { startDemo(); return; }

    var stored = lsGet(LS.url);
    if (conn) {
      state.url = conn;
      lsSet(LS.url, conn);
      state.connected = true;
      startWithCache(false);
      return;
    }
    if (stored) {
      state.url = stored;
      state.connected = true;
      startWithCache(false);
      return;
    }
    renderConnect();
  }

  /** 캐시가 있으면 0ms에 먼저 그리고, 뒤에서 조용히 최신으로 맞춥니다. */
  function startWithCache() {
    var cached = readCache();
    if (cached) {
      state.data = normalizeData(cached);
      state.data.collapsed = mergeCollapsed(state.data, cached.collapsed);
      try {
        var lsg = JSON.parse(lsGet(collKey() + 'g') || '[]') || [];
        lsg.forEach(function (k) {
          if (state.data.collapsedGroups.indexOf(k) < 0) state.data.collapsedGroups.push(k);
        });
      } catch (e) {}
      state.sheetUrl = cached.sheetUrl || '';
      renderAll();
      load({ silent: true });
      return;
    }
    renderSkeleton();
    load({ silent: false });
  }

  function mergeCollapsed(d, fromSheet) {
    var ls = [];
    try { ls = JSON.parse(lsGet(collKey()) || '[]') || []; } catch (e) {}
    var names = [];
    (Array.isArray(fromSheet) ? fromSheet : []).forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
    ls.forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
    return names.filter(function (n) { return d.cats.some(function (c) { return c.name === n; }); });
  }

  function mergeCollapsedGroups(d) {
    var lsg = [];
    try { lsg = JSON.parse(lsGet(collKey() + 'g') || '[]') || []; } catch (e) {}
    (d.collapsedGroups || (d.collapsedGroups = [])).slice();
    lsg.forEach(function (k) {
      if (d.collapsedGroups.indexOf(k) < 0) d.collapsedGroups.push(k);
    });
    return d;
  }

  function startDemo() {
    state.demo = true;
    state.connected = false;
    state.data = normalizeData(DEMO);
    state.data.collapsed = mergeCollapsed(state.data, state.data.collapsed);
    mergeCollapsedGroups(state.data);
    renderAll();
    toast('데모 화면입니다. 카드를 끌어 옮겨 보세요. (실제 시트에는 저장되지 않아요)');
  }

  function load(opt) {
    opt = opt || {};
    var silent = !!opt.silent;
    var prevCache = readCache();
    if (!state.data && !silent) renderSkeleton();
    setSync('syncing');
    jsonp({ action: 'load' }).then(function (data) {
      if (!data || data.ok === false) throw new Error((data && data.error) || '불러오지 못했습니다.');
      var norm = normalizeData(data);
      state.sheetUrl = data.sheetUrl || state.sheetUrl;
      state.backendVersion = data.backendVersion || '';
      state.backendOld = !state.backendVersion || versionLt(state.backendVersion, '2.0.0');
      norm.collapsed = mergeCollapsed(norm, norm.collapsed);
      mergeCollapsedGroups(norm);
      /* 시트에 소그룹 정보가 하나도 없으면 이 브라우저의 마지막 배치를 살려 둡니다. */
      var anyGroup = norm.links.some(function (l) { return !!l.group; });
      if (!anyGroup) mergeFromCache(norm, prevCache);
      setSync('idle');
      if (state.edit || state.dirty || state.inFlight) { state.remote = norm; return; }
      var first = !state.data;
      var changed = first || sig(norm) !== sig(state.data);
      state.data = norm;
      if (state.save !== 'saving') state.save = 'idle';
      state.dirty = false;
      writeCache(norm);
      if (first && !state.demo) state.banner = !lsGet(LS.banner);
      if (changed) renderAll();
      else paintStatus();
    }).catch(function (err) {
      setSync('idle');
      if (state.data) toast('동기화하지 못했습니다: ' + err.message, true);
      else renderConnect(err.message);
    });
  }

  function versionLt(a, b) {
    var pa = String(a || '').split('.'), pb = String(b || '').split('.');
    for (var i = 0; i < 3; i++) {
      var x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x < y) return true;
      if (x > y) return false;
    }
    return false;
  }

  /** 시트에 없는 소그룹 정보를 이 브라우저의 마지막 캐시에서 복원합니다. */
  function mergeFromCache(norm, cached) {
    if (!cached) return norm;
    var byUrl = {};
    (cached.links || []).forEach(function (l) { if (l.group) byUrl[String(l.url || '').replace(/\/$/, '')] = l.group; });
    norm.links.forEach(function (l) {
      if (!l.group) {
        var g = byUrl[l.url.replace(/\/$/, '')];
        if (g) l.group = g;
      }
    });
    norm.links.forEach(function (l) {
      if (!l.group) return;
      var c = null;
      for (var i = 0; i < norm.cats.length; i++) if (norm.cats[i].name === l.cat) { c = norm.cats[i]; break; }
      if (c && c.groups.indexOf(l.group) < 0) c.groups.push(l.group);
    });
    (cached.categories || []).forEach(function (c) {
      var t = norm.cats.filter(function (x) { return x.name === c.name; })[0];
      if (!t) return;
      (c.groups || []).forEach(function (g) { if (t.groups.indexOf(g) < 0) t.groups.push(g); });
    });
    (cached.collapsedGroups || []).forEach(function (k) {
      if (norm.collapsedGroups.indexOf(k) < 0) norm.collapsedGroups.push(k);
    });
    return norm;
  }

  function sig(d) {
    if (!d) return '';
    return JSON.stringify([
      d.title, d.theme,
      d.cats.map(function (c) { return c.name + '|' + (c.color || '') + '|' + (c.groups || []).join(';'); }),
      d.links.map(function (l) { return [l.cat, l.group || '', l.name, l.icon, l.url, l.desc, l.pin ? 1 : 0].join('|'); }),
      (d.collapsed || []).join(','),
      (d.collapsedGroups || []).join(',')
    ]);
  }

  function normalizeData(raw) {
    var cats = [];
    (raw.categories || raw.cats || []).forEach(function (c, i) {
      var name = typeof c === 'string' ? c : c.name;
      if (!name) return;
      var nm = String(name).trim();
      if (cats.some(function (x) { return x.name === nm; })) return;
      var gs = [];
      ((typeof c === 'string' ? [] : (c.groups || [])) || []).forEach(function (g) {
        var s = String(g || '').trim();
        if (s && gs.indexOf(s) < 0) gs.push(s);
      });
      cats.push({ name: nm, color: (typeof c === 'string' ? '' : (c.color || '')) || COLORS[i % COLORS.length], groups: gs });
    });
    var links = [];
    (raw.links || []).forEach(function (l) {
      var url = normalizeUrl(l.url || l.u);
      if (!url) return;
      var cat = String(l.category || l.cat || l.c || '').trim() || (cats[0] ? cats[0].name : '기타');
      links.push({
        id: uid(),
        cat: cat,
        group: String(l.group || l.g || '').trim(),
        name: String(l.name || l.n || hostOf(url)).trim(),
        icon: String(l.icon || l.i || '🔗').trim() || '🔗',
        url: url,
        desc: String(l.desc || l.d || '').trim(),
        pin: l.pin === true || l.pin === 'Y' || l.p === 'Y' || l.p === true
      });
      if (!cats.some(function (c) { return c.name === cat; })) cats.push({ name: cat, color: COLORS[cats.length % COLORS.length], groups: [] });
    });
    /* 링크에만 있는 소그룹도 카테고리 목록에 올려 둡니다. */
    links.forEach(function (l) {
      if (!l.group) return;
      var c = null;
      for (var i = 0; i < cats.length; i++) if (cats[i].name === l.cat) { c = cats[i]; break; }
      if (c && c.groups.indexOf(l.group) < 0) c.groups.push(l.group);
    });
    var collapsed = [];
    (raw.collapsed || []).forEach(function (n) {
      var s = String(n).trim();
      if (s && collapsed.indexOf(s) < 0) collapsed.push(s);
    });
    var collapsedGroups = [];
    (raw.collapsedGroups || []).forEach(function (n) {
      var s = String(n).trim();
      if (s && collapsedGroups.indexOf(s) < 0) collapsedGroups.push(s);
    });
    if (raw.sheetUrl) state.sheetUrl = raw.sheetUrl;
    return {
      title: String(raw.portalTitle || '나만의 포털'),
      theme: ['auto', 'light', 'dark'].indexOf(raw.theme) >= 0 ? raw.theme : 'auto',
      cats: cats, links: links, collapsed: collapsed, collapsedGroups: collapsedGroups, memo: raw.memo || ''
    };
  }

  /* ---------------------------------------------------------------- save */
  var saveSoon = debounce(function () { doSave(); }, 400);

  function scheduleSave() {
    if (state.demo) { paintStatus(); return; }
    state.dirty = true;
    setSave('saving');
    writeCache(state.data);
    saveSoon();
  }

  /** 화면 상태를 바꾼 직후 호출: 보기 모드는 자동 저장, 편집 모드는 완료 때 한 번에 저장. */
  function changed() {
    if (state.edit) {
      state.editDirty = true;
      paintStatus();
      renderEditBar();
      return;
    }
    if (state.demo) { paintStatus(); return; }
    scheduleSave();
  }

  function payloadOf(d) {
    var links = d.links.map(function (l) {
      return { c: l.cat, g: l.group || '', n: l.name, i: l.icon, u: l.url, d: l.desc, p: l.pin ? 'Y' : 'N' };
    });
    var p = {
      action: 'saveAll',
      portalTitle: d.title,
      theme: d.theme,
      categories: d.cats.map(function (c) { return { name: c.name, color: c.color, groups: c.groups || [] }; }),
      collapsed: d.collapsed || [],
      collapsedGroups: d.collapsedGroups || [],
      links: links
    };
    if (!links.length && state.clearAllowed) p.clear = true;
    return p;
  }

  function doSave() {
    if (state.demo) { paintStatus(); return; }
    if (!state.dirty) return;
    if (state.inFlight) { state.again = true; return; }
    if (!state.data) return;

    var payload = payloadOf(state.data);
    state.inFlight = true;
    state.dirty = false;
    setSave('saving');

    saveRemote(payload).then(function () {
      state.inFlight = false;
      state.clearAllowed = false;
      state.save = 'saved';
      paintStatus();
      writeCache(state.data);
      setTimeout(function () {
        if (!state.dirty && !state.inFlight && state.save === 'saved') { state.save = 'idle'; paintStatus(); }
      }, 2600);
      if (state.again) { state.again = false; if (state.dirty) doSave(); }
    }).catch(function (err) {
      state.inFlight = false;
      state.dirty = true;
      setSave('error');
      toast('저장하지 못했습니다: ' + err.message, true);
    });
  }

  function setSave(kind) { state.save = kind; paintStatus(); }
  function setSync(kind) { state.sync = kind; paintStatus(); }

  function paintStatus() {
    var el = $('#status');
    if (!el) return;
    var kind = 'idle', text = '자동 저장';
    if (state.demo) { kind = 'idle'; text = '데모 · 저장 안 됨'; }
    else if (state.edit) { kind = 'editing'; text = state.editDirty ? '편집 중 · 변경됨' : '편집 중'; }
    else if (state.save === 'error') { kind = 'error'; text = '저장 실패 · 다시 시도'; }
    else if (state.save === 'saving' || state.inFlight) { kind = 'saving'; text = '저장 중…'; }
    else if (state.save === 'saved') { kind = 'saved'; text = '저장됨 ✓'; }
    else if (state.sync === 'syncing') { kind = 'syncing'; text = '동기화 중…'; }
    el.className = 'status ' + kind;
    var t = el.querySelector('.txt');
    if (t) t.textContent = text;
    el.onclick = kind === 'error' ? function () { state.dirty = true; doSave(); } : null;
  }

  /* ---------------------------------------------------------------- render */
  function renderSkeleton() {
    document.body.classList.remove('disconnected');
    document.body.classList.remove('editing');
    $('#editBar').innerHTML = '';
    $('#bannerWrap').innerHTML = '';
    $('#foot').innerHTML = '';
    var h = '<div class="sk-grid">';
    for (var i = 0; i < 8; i++) {
      h += '<div class="sk"><i class="t"></i><i style="width:88%"></i><i style="width:74%"></i><i style="width:82%"></i><i style="width:64%"></i></div>';
    }
    h += '</div>';
    $('#root').innerHTML = h;
  }

  function renderAll() {
    if (!state.data) return;
    var d = state.data;
    document.title = d.title || '나만의 포털';
    $('#portalTitle').textContent = d.title || '나만의 포털';
    document.documentElement.setAttribute('data-theme', d.theme || 'auto');
    document.body.classList.remove('disconnected');
    document.body.classList.toggle('editing', !!state.edit);
    $('#btnEdit').classList.toggle('hidden', !!state.edit);
    renderEditBar();
    renderBanner();
    if (state.query.trim()) renderResults(); else renderBoard();
    renderFoot();
    paintStatus();
    updateFoldBtn();
  }

  function renderEditBar() {
    var w = $('#editBar');
    if (!state.edit) { w.innerHTML = ''; return; }
    w.innerHTML =
      '<div class="editbar"><div class="eb-in">' +
      '<span class="eb-ico">✏️</span>' +
      '<div class="eb-txt"><b>편집 중</b> — 여기서는 마음껏 바꿔도 시트에 바로 저장되지 않습니다.' +
      '<span class="eb-sub">' + (state.editDirty
        ? '변경사항이 있습니다. <b>완료</b>를 눌러야 시트에 저장됩니다.'
        : '카드를 끌어 배치를 바꾸고, 🗑 삭제·✏️ 수정을 하세요.') + '</span></div>' +
      '<div class="eb-act">' +
      '<button class="btn" id="ebCancel">↩ 취소 (원래대로)</button>' +
      '<button class="btn primary" id="ebDone">✓ 완료</button>' +
      '</div></div></div>';
    $('#ebCancel').onclick = cancelEdit;
    $('#ebDone').onclick = finishEdit;
  }

  function renderBanner() {
    var wrap = $('#bannerWrap');
    if (!state.banner || state.demo) { wrap.innerHTML = ''; return; }
    wrap.innerHTML =
      '<div class="banner">' +
      '<span>⭐</span><div class="b-txt">이 주소를 <b>브라우저 북마크 맨 앞</b>에 <code>🏠포털</code>로 저장해 두세요. ' +
      '공용 PC를 껐다 켜도 로그인만 하면 그대로 열립니다.</div>' +
      '<button class="btn sm" id="bCopy">주소 복사</button>' +
      '<button class="btn sm ghost" id="bClose">닫기</button>' +
      '</div>';
    $('#bCopy').onclick = function () {
      var u = location.href;
      if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast('주소를 복사했습니다'); }, fallbackCopy);
      else fallbackCopy();
      function fallbackCopy() {
        var t = document.createElement('textarea'); t.value = u; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); toast('주소를 복사했습니다'); } catch (e) {}
        document.body.removeChild(t);
      }
    };
    $('#bClose').onclick = function () { state.banner = false; lsSet(LS.banner, '1'); renderBanner(); };
  }

  function catColor(name) {
    var c = (state.data.cats || []).filter(function (x) { return x.name === name; })[0];
    return (c && c.color) || 'var(--acc)';
  }

  function renderBoard() {
    var d = state.data;
    var root = $('#root');
    var pins = d.links.filter(function (l) { return l.pin; });
    var html = '';

    if (pins.length) {
      html += '<div class="pinbar"><span class="pins-label">📌 즐겨찾기</span><div class="pins">';
      pins.slice(0, 16).forEach(function (l) {
        html += '<a class="pin" href="' + esc(safeUrl(l.url) || '#') + '" target="_blank" rel="noopener noreferrer" title="' + esc(l.name) + '">' +
          '<span class="pi">' + esc(l.icon) + '</span><span class="pn">' + esc(l.name) + '</span></a>';
      });
      html += '</div></div>';
    }

    if (!d.links.length && !d.cats.length) {
      html += '<div class="card-lg empty" style="margin:24px auto">' +
        '<div class="big">🗂️</div><h3>아직 링크가 없습니다</h3>' +
        '<p>링크를 하나씩 추가하거나, 브라우저에서 내보낸 북마크 HTML을 통째로 가져올 수 있어요.</p>' +
        '<div class="btns">' +
        '<button class="btn primary" id="emptyAdd">＋ 첫 링크 추가</button>' +
        '<button class="btn" id="emptyImport">📥 북마크 HTML 가져오기</button>' +
        (state.demo ? '' : '<button class="btn" id="emptySheet">▦ 시트 열기</button>') +
        '</div></div>';
      root.innerHTML = html;
      if ($('#emptyAdd')) $('#emptyAdd').onclick = function () { openLinkModal(null, null); };
      if ($('#emptyImport')) $('#emptyImport').onclick = pickFile;
      if ($('#emptySheet')) $('#emptySheet').onclick = openSheet;
      return;
    }

    html += '<div class="board" id="board">';
    d.cats.forEach(function (c) { html += panelHtml(c); });
    if (state.edit) html += '<button class="addcat-tile" data-act="addcat">＋ 새 카테고리</button>';
    html += '</div>';
    root.innerHTML = html;
  }

  function panelHtml(c) {
    var items = state.data.links.filter(function (l) { return l.cat === c.name; });
    var collapsed = (state.data.collapsed || []).indexOf(c.name) >= 0;
    var gs = groupsOf(c.name);
    var chev = collapsed ? '▸' : '▾';
    var h = '<section class="panel' + (collapsed ? ' is-collapsed' : '') + '" data-cat="' + esc(c.name) + '" style="--c:' + esc(c.color || 'var(--acc)') + '">';
    var openBtn = '<button class="open-mini" data-act="open-all" title="이 카테고리의 링크를 모두 새 탭에서 열기">↗</button>';

    if (state.edit) {
      h += '<div class="ph">' +
        '<button class="collapser" data-act="collapse" aria-expanded="' + (collapsed ? 'false' : 'true') + '" title="접기 / 펼치기">' + chev + '</button>' +
        '<span class="cat-grip" title="끌어서 카테고리 순서 바꾸기">⠿</span>' +
        '<input class="cat-name" value="' + esc(c.name) + '" data-cat="' + esc(c.name) + '" aria-label="카테고리 이름" />' +
        '<span class="cnt">' + items.length + '</span>' + openBtn +
        '</div>' +
        '<div class="ed-head"><div class="dots">' +
        COLORS.map(function (col) {
          return '<button data-color="' + col + '" style="--dc:' + col + '" class="' + (col === c.color ? 'on' : '') + '" title="' + col + '"></button>';
        }).join('') +
        '</div><span class="spacer"></span>' +
        '<button class="mini" data-act="add-here" title="이 카테고리에 링크 추가">＋ 링크</button>' +
        '<button class="mini danger" data-act="cat-del" title="이 카테고리 삭제">🗑</button>' +
        '</div>';
    } else {
      h += '<div class="ph">' +
        '<button class="collapser" data-act="collapse" aria-expanded="' + (collapsed ? 'false' : 'true') + '" title="접기 / 펼치기">' + chev + '</button>' +
        '<span class="pdot"></span><h2 title="두 번 누르면 이름 바꾸기">' + esc(c.name) + '</h2><span class="cnt">' + items.length + '</span>' +
        openBtn +
        '<span class="cat-grip" title="끌어서 카테고리 순서 바꾸기">⠿</span>' +
        '<button class="add-mini" data-act="add-here" title="이 카테고리에 링크 추가">＋</button>' +
        '</div>';
    }

    h += '<div class="plist">';
    if (!items.length && !gs.length) {
      h += '<div class="empty-msg">' + (state.edit ? '여기로 링크를 끌어다 놓으세요' : '아직 링크가 없습니다') + '</div>';
    } else {
      items.filter(function (l) { return !l.group; }).forEach(function (l) { h += chipHtml(l); });
      gs.forEach(function (g) {
        h += groupHtml(c, g, items.filter(function (l) { return l.group === g; }));
      });
    }
    h += '</div>';
    if (state.edit) h += '<button class="add-group" data-act="g-add">＋ 소그룹</button>';
    h += '</section>';
    return h;
  }

  /** 카테고리 안의 소그룹 순서: 카테고리에 저장된 순서 → 링크에만 있는 소그룹. */
  function groupsOf(catName) {
    var out = [], seen = {};
    var c = state.data.cats.filter(function (x) { return x.name === catName; })[0];
    ((c && c.groups) || []).forEach(function (g) {
      var s = String(g || '').trim();
      if (s && !seen[s]) { seen[s] = 1; out.push(s); }
    });
    state.data.links.forEach(function (l) {
      if (l.cat === catName && l.group && !seen[l.group]) { seen[l.group] = 1; out.push(l.group); }
    });
    return out;
  }

  function gkey(cat, group) { return cat + '»' + group; }

  function groupHtml(c, g, gl) {
    var collapsed = (state.data.collapsedGroups || []).indexOf(gkey(c.name, g)) >= 0;
    var h = '<div class="grp' + (collapsed ? ' is-collapsed' : '') + '" data-group="' + esc(g) + '" data-cat="' + esc(c.name) + '">';
    h += '<div class="grp-head" data-act="gtoggle" title="접기 / 펼치기 · 끌어서 소그룹 옮기기">' +
      '<button class="gchev-btn" data-act="gtoggle" aria-expanded="' + (collapsed ? 'false' : 'true') + '" title="접기 / 펼치기">' + (collapsed ? '▸' : '▾') + '</button>' +
      '<span class="gname" title="두 번 누르면 이름 바꾸기">' + esc(g) + '</span>' +
      '<span class="gcnt">' + gl.length + '</span>' +
      '<button class="gbtn gopen" data-act="g-open-all" title="이 소그룹의 링크를 모두 새 탭에서 열기">↗</button>' +
      (state.edit ? '<button class="gbtn" data-act="g-ren" title="소그룹 이름 바꾸기">✏️</button>' +
        '<button class="gbtn del" data-act="g-del" title="소그룹 삭제">🗑</button>' : '') +
      '</div>';
    h += '<div class="grp-body">';
    gl.forEach(function (l) { h += chipHtml(l); });
    h += '</div></div>';
    return h;
  }

  function chipHtml(l) {
    var h = '<div class="lk" data-id="' + l.id + '" data-cat="' + esc(l.cat) + '" data-group="' + esc(l.group || '') + '" data-url="' + esc(l.url) + '" role="link" tabindex="0" ' +
      'title="' + esc(l.name + (l.desc ? ' — ' + l.desc : '') + '\n' + l.url) + '">' +
      '<span class="ico">' + esc(l.icon) + '</span>' +
      '<span class="nm">' + esc(l.name) + '</span>' +
      '<span class="go">↗</span>';
    if (state.edit) {
      h += '<div class="ctools">' +
        '<button data-act="pin" class="' + (l.pin ? 'on' : '') + '" title="상단 고정">📌</button>' +
        '<button data-act="edit" title="수정">✏️</button>' +
        '<button data-act="del" class="del" title="삭제">🗑</button>' +
        '</div>';
    }
    return h + '</div>';
  }

  function renderResults() {
    var q = state.query.trim().toLowerCase();
    var hits = state.data.links.filter(function (l) {
      return (l.name + ' ' + l.cat + ' ' + l.desc + ' ' + l.url).toLowerCase().indexOf(q) >= 0;
    });
    state.hits = hits;
    state.sel = hits.length ? 0 : -1;
    var html = '<div class="results"><div class="rh"><span><b>' + hits.length + '</b>개 결과 · ' + esc(state.query.trim()) + '</span>' +
      '<span>Enter ↵ 첫 결과 열기 · Esc 지우기</span></div>';
    if (!hits.length) html += '<div class="empty" style="padding:26px"><p style="margin:0">일치하는 링크가 없습니다.</p></div>';
    hits.forEach(function (l, i) {
      html += '<a class="res' + (i === state.sel ? ' sel' : '') + '" data-i="' + i + '" href="' + esc(safeUrl(l.url) || '#') + '" target="_blank" rel="noopener noreferrer" style="--c:' + esc(catColor(l.cat)) + '">' +
        '<span class="ico">' + esc(l.icon) + '</span><span class="nm">' + esc(l.name) + '</span>' +
        '<span class="tag">' + esc(l.cat) + '</span>' +
        (l.desc ? '<span class="ds">' + esc(l.desc) + '</span>' : '') +
        '<span class="k">' + (i === 0 ? 'Enter ↵' : '') + '</span></a>';
    });
    $('#root').innerHTML = html + '</div>';
  }

  function renderFoot() {
    if (!state.data) { $('#foot').innerHTML = ''; return; }
    var n = state.data.links.length, c = state.data.cats.length;
    var html = '<span>링크 <b>' + n + '</b>개 · 카테고리 <b>' + c + '</b>개</span><span class="sep">|</span>';
    var hasGroups = state.data.links.some(function (l) { return !!l.group; });
    if (hasGroups && state.backendOld && !state.demo) {
      html += '<span style="color:var(--danger)" title="지금 연결된 Apps Script가 예전 버전이라 소그룹 열을 저장하지 못합니다. apps-script/Code.gs(2.0.0)를 붙여 넣고 새 버전으로 배포하면 시트에도 저장됩니다.">⚠ 소그룹은 이 기기에만 보관 중</span><span class="sep">|</span>';
    }
    html += '<a href="#" id="fRefresh">↻ 새로고침</a>';
    if (!state.demo) html += '<span class="sep">|</span><a href="#" id="fSheet">▦ 시트 열기</a>';
    html += '<span class="sep">|</span><a href="#" id="fImport">📥 북마크 가져오기</a>';
    html += '<span class="sep">|</span><a href="#" id="fDemo">?demo=1 데모</a>';
    if (!state.demo) html += '<span class="sep">|</span><a href="#" id="fConn">연결 주소</a>';
    $('#foot').innerHTML = html;
    $('#fRefresh').onclick = function (e) { e.preventDefault(); load({ silent: !!state.data }); };
    if ($('#fSheet')) $('#fSheet').onclick = function (e) { e.preventDefault(); openSheet(); };
    $('#fImport').onclick = function (e) { e.preventDefault(); pickFile(); };
    $('#fDemo').onclick = function (e) { e.preventDefault(); location.href = location.pathname + '?demo=1'; };
    if ($('#fConn')) $('#fConn').onclick = function (e) { e.preventDefault(); renderConnect(null, true); };
  }

  function openSheet() {
    if (state.sheetUrl) window.open(state.sheetUrl, '_blank', 'noopener');
    else toast('시트 주소를 알 수 없습니다.', true);
  }

  /* ---------------------------------------------------------------- connect */
  function renderConnect(err, fromMenu) {
    if (!fromMenu) state.data = null;
    document.body.classList.add('disconnected');
    document.body.classList.remove('editing');
    state.edit = false;
    $('#bannerWrap').innerHTML = '';
    $('#editBar').innerHTML = '';
    $('#foot').innerHTML = '';
    document.title = '나만의 포털';
    var cur = state.url || lsGet(LS.url);
    $('#root').innerHTML =
      '<div class="center"><div class="card-lg">' +
      '<h2>🏠 나만의 포털 연결</h2>' +
      '<p class="lead">링크 목록은 내 구글 시트에만 있고, 이 페이지에는 아무 것도 저장되지 않습니다. ' +
      '공용 PC에서도 주소 한 줄만 있으면 그대로 열립니다.</p>' +
      (err ? '<div class="banner" style="margin:0 0 14px;background:color-mix(in srgb, var(--danger) 12%, transparent);border-color:color-mix(in srgb, var(--danger) 35%, transparent)">⚠️ ' + esc(err) + '</div>' : '') +
      '<ol class="steps">' +
      '<li>내 구글 시트의 <code>확장 프로그램 → Apps Script</code>에 <code>Code.gs</code>를 붙여 넣고 저장</li>' +
      '<li><code>배포 → 새 배포 → 웹 앱</code>, 실행: 나 / 액세스: <b>모든 사용자</b> 로 배포</li>' +
      '<li>나온 <code>.../exec</code> 주소를 아래에 붙여 넣기</li>' +
      '</ol>' +
      '<div class="field"><label for="connUrl">Apps Script 웹 앱 주소</label>' +
      '<input id="connUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(cur) + '" spellcheck="false" />' +
      '<span class="hint">주소를 연결하면 브라우저 주소창이 <code>#s=…</code> 형태로 바뀝니다. 그 주소를 즐겨찾기에 넣으면 끝!</span></div>' +
      '<div class="btns" style="justify-content:flex-start;margin-top:14px">' +
      '<button class="btn primary" id="btnConnect">연결하기</button>' +
      '<button class="btn" id="btnDemo">데모 먼저 보기</button>' +
      (fromMenu ? '<button class="btn ghost" id="btnBack">돌아가기</button>' : '') +
      '</div></div></div>';

    $('#btnConnect').onclick = function () { connect($('#connUrl').value.trim()); };
    $('#connUrl').addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(this.value.trim()); });
    $('#btnDemo').onclick = function () { location.href = location.pathname + '?demo=1'; };
    if ($('#btnBack')) $('#btnBack').onclick = function () { state.data ? renderAll() : boot(); };
    setTimeout(function () { var el = $('#connUrl'); if (el && !cur) el.focus(); }, 50);
  }

  function connect(url) {
    url = String(url || '').trim();
    if (!/^https:\/\/script\.google\.com\//.test(url)) {
      toast('script.google.com 의 .../exec 주소를 넣어 주세요.', true);
      return;
    }
    if (/\/dev$/.test(url)) url = url.replace(/\/dev$/, '/exec');
    var btn = $('#btnConnect');
    if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }

    var prev = state.url;
    state.url = url;
    jsonp({ action: 'ping' }).then(function (data) {
      if (!data || data.ok !== true) throw new Error((data && data.error) || '응답이 올바르지 않습니다.');
      state.connected = true;
      lsSet(LS.url, url);
      lsSet(LS.banner, '');
      try { history.replaceState(null, '', location.pathname + '#s=' + b64encode(url)); } catch (e) {}
      state.banner = true;
      state.save = 'idle';
      startWithCache();
    }).catch(function (err) {
      state.url = prev && prev !== url ? prev : '';
      if (btn) { btn.disabled = false; btn.textContent = '연결하기'; }
      toast('연결 실패: ' + err.message, true);
    });
  }

  /* ---------------------------------------------------------------- editing */
  function linkById(id) {
    return state.data.links.filter(function (l) { return l.id === id; })[0] || null;
  }
  function catIndex(name) {
    for (var i = 0; i < state.data.cats.length; i++) if (state.data.cats[i].name === name) return i;
    return -1;
  }
  function endOfCatIndex(cat) {
    var arr = state.data.links, at = arr.length;
    for (var i = arr.length - 1; i >= 0; i--) if (arr[i].cat === cat) { at = i + 1; break; }
    return at;
  }

  function startEdit() {
    state.snapshot = clone(state.data);
    state.edit = true;
    state.editDirty = false;
    if (state.query) { state.query = ''; if ($('#q')) $('#q').value = ''; }
    renderAll();
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    toast(coarse ? '편집 모드 — 카드를 길게 눌러 끌면 옮길 수 있어요' : '편집 모드 — 마음껏 바꾼 뒤 [완료]를 누르면 저장됩니다');
  }

  function finishEdit() {
    var dirty = state.editDirty;
    state.edit = false;
    state.editDirty = false;
    state.snapshot = null;
    renderAll();
    if (dirty) { state.dirty = true; doSave(); }
    else { state.save = 'idle'; paintStatus(); toast('바뀐 내용이 없습니다'); }
  }

  function cancelEdit() {
    if (state.snapshot) {
      state.data.cats = state.snapshot.cats;
      state.data.links = state.snapshot.links;
      state.data.title = state.snapshot.title;
      state.data.theme = state.snapshot.theme;
    }
    state.edit = false;
    state.editDirty = false;
    state.snapshot = null;
    state.dirty = false;
    renderAll();
    state.save = 'idle';
    paintStatus();
    toast('편집 전 상태로 되돌렸습니다');
  }

  function deleteLink(id) {
    var l = linkById(id);
    if (!l) return;
    if (!confirm('“' + l.name + '” 링크를 지울까요?' + (state.edit ? '\n\n완료를 누르면 시트에도 반영됩니다.' : '\n\n지운 내용은 바로 저장됩니다.'))) return;
    var snap = undoSnapshot();
    state.data.links = state.data.links.filter(function (x) { return x.id !== id; });
    if (!state.data.links.length) state.clearAllowed = true;
    renderAll();
    changed();
    offerUndo(snap, '“' + l.name + '”을(를) 지웠습니다');
  }

  function togglePin(id) {
    var l = linkById(id);
    if (!l) return;
    l.pin = !l.pin;
    renderAll();
    changed();
  }

  function addCategory() {
    var name = prompt('새 카테고리 이름', '새 카테고리');
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    if (catIndex(name) >= 0) { toast('이미 있는 카테고리입니다.', true); return; }
    state.data.cats.push({ name: name, color: COLORS[state.data.cats.length % COLORS.length] });
    renderAll();
    changed();
  }

  function removeCategory(name) {
    var items = state.data.links.filter(function (l) { return l.cat === name; });
    if (!confirm('“' + name + '” 카테고리를 지울까요?' + (items.length ? '\n안에 있는 링크 ' + items.length + '개도 함께 지워집니다.' : ''))) return;
    deleteCategoryNow(name);
  }

  /** 확인을 마친 카테고리 삭제(링크·소그룹 포함). 되돌리기 가능. */
  function deleteCategoryNow(name) {
    var snap = undoSnapshot();
    var n = state.data.links.filter(function (l) { return l.cat === name; }).length;
    state.data.cats = state.data.cats.filter(function (c) { return c.name !== name; });
    state.data.links = state.data.links.filter(function (l) { return l.cat !== name; });
    state.data.collapsed = (state.data.collapsed || []).filter(function (x) { return x !== name; });
    state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k.indexOf(name + '»') !== 0; });
    if (!state.data.links.length) state.clearAllowed = true;
    renderAll();
    changed();
    offerUndo(snap, '“' + name + '”' + (n ? ' (링크 ' + n + '개)' : '') + '를 지웠습니다');
  }

  function renameCategory(from, to) {
    to = String(to || '').trim();
    if (!to || to === from) return false;
    if (catIndex(to) >= 0) { toast('이미 있는 이름입니다.', true); return false; }
    var i = catIndex(from);
    if (i < 0) return false;
    state.data.cats[i].name = to;
    state.data.links.forEach(function (l) { if (l.cat === from) l.cat = to; });
    var ci = (state.data.collapsed || []).indexOf(from);
    if (ci >= 0) state.data.collapsed[ci] = to;
    state.data.collapsedGroups = (state.data.collapsedGroups || []).map(function (k) {
      return k.indexOf(from + '»') === 0 ? to + '»' + k.slice(from.length + 1) : k;
    });
    return true;
  }

  function toggleCollapse(cat) {
    if (!state.data) return;
    var arr = state.data.collapsed || (state.data.collapsed = []);
    var i = arr.indexOf(cat);
    if (i >= 0) arr.splice(i, 1); else arr.push(cat);
    persistCollapsed();
    var panel = $('.panel[data-cat="' + cssEsc(cat) + '"]');
    if (panel) {
      var collapsed = arr.indexOf(cat) >= 0;
      panel.classList.toggle('is-collapsed', collapsed);
      var btn = panel.querySelector('.collapser');
      if (btn) { btn.textContent = collapsed ? '▸' : '▾'; btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true'); }
    }
    if (state.edit) state.editDirty = true; else scheduleSave();
    savePrefs();
    updateFoldBtn();
  }

  /** 상단 모두 접기 / 모두 펼치기 */
  function allGroupKeys() {
    var out = [];
    state.data.cats.forEach(function (c) {
      groupsOf(c.name).forEach(function (g) { out.push(gkey(c.name, g)); });
    });
    return out;
  }

  function everythingCollapsed() {
    if (!state.data || !state.data.cats.length) return false;
    return state.data.cats.every(function (c) { return (state.data.collapsed || []).indexOf(c.name) >= 0; }) &&
      allGroupKeys().every(function (k) { return (state.data.collapsedGroups || []).indexOf(k) >= 0; });
  }

  function foldAll(collapse) {
    if (!state.data) return;
    state.data.collapsed = collapse ? state.data.cats.map(function (c) { return c.name; }) : [];
    state.data.collapsedGroups = collapse ? allGroupKeys() : [];
    persistCollapsed();
    persistCollapsedGroups();
    if (state.edit) state.editDirty = true; else scheduleSave();
    renderAll();
    savePrefs();
    toast(collapse ? '모든 카테고리와 소그룹을 접었습니다' : '모두 펼쳤습니다');
  }

  function updateFoldBtn() {
    var b = $('#btnFold');
    if (!b) return;
    var all = everythingCollapsed();
    b.innerHTML = (all ? '▸' : '▾') + ' <span class="lbl">' + (all ? '모두 펼치기' : '모두 접기') + '</span>';
    b.title = all ? '모든 카테고리와 소그룹 펼치기' : '모든 카테고리와 소그룹 접기';
  }

  function cssEsc(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  /* ---------------------------------------------------------------- 소그룹 */
  function persistCollapsedGroups() {
    var k = collKey();
    if (k) lsSet(k + 'g', JSON.stringify((state.data && state.data.collapsedGroups) || []));
  }

  function toggleGroup(cat, g) {
    if (!state.data) return;
    var arr = state.data.collapsedGroups || (state.data.collapsedGroups = []);
    var key = gkey(cat, g);
    var i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key);
    persistCollapsedGroups();
    var el = $('.grp[data-cat="' + cssEsc(cat) + '"][data-group="' + cssEsc(g) + '"]');
    if (el) {
      var isC = arr.indexOf(key) >= 0;
      el.classList.toggle('is-collapsed', isC);
      var ch = el.querySelector('.gchev-btn');
      if (ch) { ch.textContent = isC ? '▸' : '▾'; ch.setAttribute('aria-expanded', isC ? 'false' : 'true'); }
    }
    if (state.edit) state.editDirty = true; else scheduleSave();
    savePrefs();
    updateFoldBtn();
  }

  function ensureGroup(cat, g) {
    if (!g) return;
    var c = state.data.cats.filter(function (x) { return x.name === cat; })[0];
    if (!c) return;
    c.groups = c.groups || [];
    if (c.groups.indexOf(g) < 0) c.groups.push(g);
  }

  function addGroup(cat) {
    var name = prompt('새 소그룹 이름\n(예: 수업 준비, 행정·공문)', '새 소그룹');
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    var c = state.data.cats.filter(function (x) { return x.name === cat; })[0];
    if (!c) return;
    c.groups = c.groups || [];
    if (c.groups.indexOf(name) >= 0) { toast('이미 있는 소그룹입니다.', true); return; }
    c.groups.push(name);
    renderAll();
    changed();
  }

  function renameGroup(cat, g) {
    var name = prompt('소그룹 이름', g);
    if (name === null) return;
    if (renameGroupTo(cat, g, name)) { renderAll(); changed(); }
  }

  /** 소그룹 이름 변경(프롬프트 없이). 성공하면 true. */
  function renameGroupTo(cat, g, to) {
    to = String(to || '').trim();
    if (!to || to === g) return false;
    var c = state.data.cats.filter(function (x) { return x.name === cat; })[0];
    if (!c) return false;
    c.groups = c.groups || [];
    if (c.groups.indexOf(to) >= 0) { toast('이미 있는 이름입니다.', true); return false; }
    var i = c.groups.indexOf(g);
    if (i >= 0) c.groups[i] = to; else c.groups.push(to);
    state.data.links.forEach(function (l) { if (l.cat === cat && l.group === g) l.group = to; });
    state.data.collapsedGroups = (state.data.collapsedGroups || []).map(function (k) {
      return k === gkey(cat, g) ? gkey(cat, to) : k;
    });
    return true;
  }

  function removeGroup(cat, g) {
    var n = state.data.links.filter(function (l) { return l.cat === cat && l.group === g; }).length;
    if (!confirm('“' + g + '” 소그룹을 지울까요?' + (n ? '\n링크 ' + n + '개는 “그룹 없음”으로 옮겨집니다.' : ''))) return;
    var snap = undoSnapshot();
    state.data.links.forEach(function (l) { if (l.cat === cat && l.group === g) l.group = ''; });
    var c = state.data.cats.filter(function (x) { return x.name === cat; })[0];
    if (c) c.groups = (c.groups || []).filter(function (x) { return x !== g; });
    state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k !== gkey(cat, g); });
    renderAll();
    changed();
    offerUndo(snap, '“' + g + '” 소그룹을 지웠습니다');
  }

  /* ------------------------------------------------ 되돌리기 · 모두 열기 */
  function undoSnapshot() {
    return {
      cats: clone(state.data.cats),
      links: clone(state.data.links),
      collapsed: (state.data.collapsed || []).slice(),
      collapsedGroups: (state.data.collapsedGroups || []).slice()
    };
  }

  function offerUndo(snap, msg) {
    if (!snap) { toast(msg); return; }
    toast(msg, false, { label: '↩ 되돌리기', fn: function () {
      state.data.cats = snap.cats;
      state.data.links = snap.links;
      state.data.collapsed = snap.collapsed;
      state.data.collapsedGroups = snap.collapsedGroups;
      renderAll();
      changed();
      toast('되돌렸습니다');
    } });
  }

  function openAllLinks(items, label) {
    items = items || [];
    if (!items.length) { toast(label + '에 열 링크가 없습니다.', true); return; }
    if (items.length > 5 && !confirm(label + ' 링크 ' + items.length + '개를 새 탭에서 열까요?')) return;
    var blocked = 0;
    items.forEach(function (l) {
      var u = safeUrl(l.url);
      if (!u) return;
      var w = null;
      try { w = window.open(u, '_blank'); } catch (e) {}
      if (w) { try { w.opener = null; } catch (e) {} } else blocked++;
    });
    toast(items.length + '개를 새 탭에서 열었습니다' + (blocked ? ' · ' + blocked + '개는 팝업 차단됨 — 주소창의 차단 아이콘에서 허용해 주세요' : ''), !!blocked);
  }

  /* ------------------------------------------------ 소그룹 이동 · 승격 */
  function catByName(name) {
    return state.data.cats.filter(function (c) { return c.name === name; })[0] || null;
  }

  /** 소그룹을 다른 카테고리로 옮기거나 같은 카테고리 안에서 순서를 바꿉니다. */
  function moveGroupTo(fromCat, g, toCat, targetGroup, after, append) {
    if (!g) return false;
    var from = catByName(fromCat), to = catByName(toCat);
    if (!from || !to) return false;
    if (fromCat === toCat && targetGroup === g) return false;
    var sameName = fromCat !== toCat && groupsOf(toCat).indexOf(g) >= 0;

    /* 링크는 통째로 따라갑니다. */
    var n = 0;
    state.data.links.forEach(function (l) {
      if (l.cat === fromCat && l.group === g) { l.cat = toCat; l.group = g; n++; }
    });

    if (sameName) {
      from.groups = (from.groups || []).filter(function (x) { return x !== g; });
      state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k !== gkey(fromCat, g); });
      return { moved: n, merged: true };
    }

    to.groups = to.groups || [];
    var list = to.groups.filter(function (x) { return x !== g; });
    var idx;
    if (append || !targetGroup || list.indexOf(targetGroup) < 0) idx = list.length;
    else idx = list.indexOf(targetGroup) + (after ? 1 : 0);
    list.splice(Math.max(0, Math.min(idx, list.length)), 0, g);
    to.groups = list;

    if (fromCat !== toCat) {
      from.groups = (from.groups || []).filter(function (x) { return x !== g; });
      state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k !== gkey(fromCat, g); });
    }
    return { moved: n, merged: false };
  }

  /** 카테고리를 다른 카테고리 안의 소그룹으로 넣습니다. */
  function demoteCategoryToGroup(fromName, toName) {
    if (!fromName || !toName || fromName === toName) return false;
    var from = catByName(fromName), to = catByName(toName);
    if (!from || !to) return false;
    var inner = groupsOf(fromName).length;
    var links = state.data.links.filter(function (l) { return l.cat === fromName; });
    var merged = groupsOf(toName).indexOf(fromName) >= 0;
    to.groups = to.groups || [];
    if (!merged) to.groups.push(fromName);
    links.forEach(function (l) { l.cat = toName; l.group = fromName; });
    state.data.cats = state.data.cats.filter(function (c) { return c.name !== fromName; });
    state.data.collapsed = (state.data.collapsed || []).filter(function (x) { return x !== fromName; });
    state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k.indexOf(fromName + '»') !== 0; });
    return { n: links.length, inner: inner, merged: merged };
  }

  /** 소그룹을 독립 카테고리로 꺼냅니다. 같은 이름 카테고리가 있으면 그쪽으로 합칩니다. */
  function promoteGroupToCategory(cat, g) {
    if (!g) return false;
    var src = catByName(cat);
    if (!src) return false;
    var links = state.data.links.filter(function (l) { return l.cat === cat && l.group === g; });
    var merged = catIndex(g) >= 0;
    if (!merged) {
      var at = catIndex(cat);
      var newCat = { name: g, color: COLORS[state.data.cats.length % COLORS.length], groups: [] };
      state.data.cats.splice(at >= 0 ? at + 1 : state.data.cats.length, 0, newCat);
    }
    links.forEach(function (l) { l.cat = g; l.group = ''; });
    src.groups = (src.groups || []).filter(function (x) { return x !== g; });
    state.data.collapsedGroups = (state.data.collapsedGroups || []).filter(function (k) { return k !== gkey(cat, g); });
    return { n: links.length, merged: merged };
  }

  /* ------------------------------------------------ 이름 바로 바꾸기 */
  function inlineEditName(el, current, commit) {
    if (!el || el.querySelector('input')) return;
    var input = document.createElement('input');
    input.className = 'in-rename';
    input.value = current;
    input.setAttribute('aria-label', '이름 바꾸기 · Enter 저장, Esc 취소');
    el.style.display = 'none';
    el.parentNode.insertBefore(input, el.nextSibling);
    input.focus();
    input.select();
    var done = false;
    function finish(ok) {
      if (done) return;
      done = true;
      var v = input.value.trim();
      if (input.parentNode) input.parentNode.removeChild(input);
      el.style.display = '';
      if (ok && v && v !== current) commit(v);
    }
    input.addEventListener('keydown', function (e) {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', function () { finish(true); });
    input.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    input.addEventListener('click', function (e) { e.stopPropagation(); });
    input.addEventListener('dblclick', function (e) { e.stopPropagation(); });
  }

  /* ------------------------------------------------ 오른쪽 버튼 메뉴 */
  function closeCtx() {
    var m = $('#ctxMenu');
    if (!m) return;
    m.classList.add('hidden');
    m.innerHTML = '';
  }

  function openCtx(x, y, title, items) {
    var m = $('#ctxMenu');
    if (!m) return;
    m.innerHTML = '';
    if (title) {
      var hd = document.createElement('div');
      hd.className = 'chead';
      hd.textContent = title;
      m.appendChild(hd);
    }
    items.forEach(function (it) {
      if (it === '-') { var s = document.createElement('div'); s.className = 'sep'; m.appendChild(s); return; }
      var b = document.createElement('button');
      b.className = 'ci' + (it.danger ? ' danger' : '');
      b.innerHTML = '<span class="ic">' + esc(it.ic || '') + '</span><span>' + esc(it.label) + '</span>';
      b.onclick = function () { closeCtx(); it.fn(); };
      m.appendChild(b);
    });
    m.classList.remove('hidden');
    var vw = window.innerWidth, vh = window.innerHeight;
    var w = m.offsetWidth, h = m.offsetHeight;
    var left = Math.max(8, Math.min(x, vw - w - 8));
    var top = Math.max(8, Math.min(y, vh - h - 8));
    m.style.left = left + 'px';
    m.style.top = top + 'px';
  }

  function linkCtx(link, x, y) {
    var items = [
      { ic: '↗', label: '새 탭에서 열기', fn: function () { openLink(link.url); } },
      { ic: '📋', label: '주소(URL) 복사', fn: function () { copyText(link.url, '주소를 복사했습니다'); } },
      '-',
      { ic: '✏️', label: '이름·주소 수정', fn: function () { openLinkModal(link, null); } },
      { ic: '📁', label: '다른 폴더로 이동', fn: function () { openMoveModal(link); } },
      { ic: '📌', label: link.pin ? '즐겨찾기 고정 해제' : '즐겨찾기 고정', fn: function () { togglePin(link.id); } },
      '-',
      { ic: '🗑', label: '삭제', danger: true, fn: function () { deleteLink(link.id); } }
    ];
    openCtx(x, y, link.name, items);
  }

  function categoryCtx(cat, x, y) {
    var collapsed = (state.data.collapsed || []).indexOf(cat) >= 0;
    var items = [
      { ic: '↗', label: '모두 새 탭에서 열기', fn: function () { openAllLinks(state.data.links.filter(function (l) { return l.cat === cat; }), '“' + cat + '”'); } },
      { ic: '✏️', label: '이름 바꾸기', fn: function () { var h = $('.panel[data-cat="' + cssEsc(cat) + '"] .ph h2'); if (h) inlineEditName(h, cat, function (v) { if (renameCategory(cat, v)) { renderAll(); changed(); } }); else { var inp = $('.panel[data-cat="' + cssEsc(cat) + '"] .cat-name'); if (inp) { inp.focus(); inp.select(); } } } },
      { ic: collapsed ? '▾' : '▸', label: collapsed ? '펼치기' : '접기', fn: function () { toggleCollapse(cat); } },
      '-',
      { ic: '🗑', label: '카테고리 삭제', danger: true, fn: function () {
        var n = state.data.links.filter(function (l) { return l.cat === cat; }).length;
        if (!confirm('“' + cat + '” 카테고리를 지울까요?' + (n ? '\n안에 있는 링크 ' + n + '개도 함께 지워집니다.' : ''))) return;
        deleteCategoryNow(cat);
      } }
    ];
    openCtx(x, y, '📁 ' + cat, items);
  }

  function groupCtx(cat, g, x, y) {
    var collapsed = (state.data.collapsedGroups || []).indexOf(gkey(cat, g)) >= 0;
    var items = [
      { ic: '↗', label: '모두 새 탭에서 열기', fn: function () { openAllLinks(state.data.links.filter(function (l) { return l.cat === cat && l.group === g; }), '“' + g + '”'); } },
      { ic: '✏️', label: '이름 바꾸기', fn: function () { var h = $('.grp[data-cat="' + cssEsc(cat) + '"][data-group="' + cssEsc(g) + '"] .gname'); if (h) inlineEditName(h, g, function (v) { if (renameGroupTo(cat, g, v)) { renderAll(); changed(); } }); } },
      { ic: collapsed ? '▾' : '▸', label: collapsed ? '펼치기' : '접기', fn: function () { toggleGroup(cat, g); } },
      '-',
      { ic: '🗑', label: '소그룹 삭제', danger: true, fn: function () { removeGroup(cat, g); } }
    ];
    openCtx(x, y, '📂 ' + cat + ' › ' + g, items);
  }

  function copyText(text, msg) {
    function fallback() {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); toast(msg); } catch (e) { toast('복사하지 못했습니다.', true); }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(msg); }, fallback);
    else fallback();
  }

  /** 링크를 다른 카테고리·소그룹으로 옮기는 작은 창. */
  function openMoveModal(link) {
    if (!link) return;
    var cats = state.data.cats;
    openModal(
      '<div class="sh-head"><h3>다른 폴더로 이동</h3><button class="x" id="mX">✕</button></div>' +
      '<p style="font-size:13px;color:var(--mut);margin:0 0 12px">“' + esc(link.name) + '”</p>' +
      '<div class="row2">' +
      '<div class="field"><label for="mvCat">카테고리</label><select id="mvCat">' + cats.map(function (c) { return '<option value="' + esc(c.name) + '"' + (c.name === link.cat ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="mvGroup">소그룹</label><select id="mvGroup"></select></div>' +
      '</div>' +
      '<div class="sh-foot"><button class="btn" id="mCancel">취소</button><button class="btn primary" id="mvGo">이동</button></div>'
    );
    $('#mX').onclick = $('#mCancel').onclick = closeModal;
    function fill(catName, selected) {
      var gs = groupsOf(catName);
      var html = '<option value="">그룹 없음</option>';
      gs.forEach(function (g) { html += '<option value="' + esc(g) + '"' + (g === selected ? ' selected' : '') + '>' + esc(g) + '</option>'; });
      html += '<option value="__new">＋ 새 소그룹…</option>';
      $('#mvGroup').innerHTML = html;
    }
    fill(link.cat, link.group);
    $('#mvCat').onchange = function () { fill(this.value, ''); };
    $('#mvGroup').onchange = function () {
      if (this.value !== '__new') return;
      var n = prompt('새 소그룹 이름', '새 소그룹');
      if (n && n.trim()) {
        var nm = n.trim();
        ensureGroup($('#mvCat').value, nm);
        var o = document.createElement('option'); o.value = o.textContent = nm;
        this.insertBefore(o, this.lastElementChild); this.value = nm;
      } else this.value = '';
    };
    $('#mvGo').onclick = function () {
      var toCat = $('#mvCat').value;
      var toGroup = $('#mvGroup').value;
      if (toGroup === '__new') toGroup = '';
      if (toCat === link.cat && toGroup === (link.group || '')) { closeModal(); return; }
      var snap = undoSnapshot();
      ensureGroup(toCat, toGroup);
      link.cat = toCat; link.group = toGroup;
      var arr = state.data.links, at = arr.indexOf(link);

  /* ---------------------------------------------------------------- import */
  function pickFile() { $('#fileInput').value = ''; $('#fileInput').click(); }

  var ROOT_FOLDERS = ['북마크바', '북마크 바', '즐겨찾기 모음', '즐겨찾기', '기타 북마크', 'bookmarks bar', 'bookmarks toolbar', 'favorites bar', 'other bookmarks'];

  /** 이 DL을 제목짓는 H3를 찾습니다(크로미움 내보내기 형식). */
  function folderTitleOf(dl) {
    var el = dl.previousElementSibling;
    while (el) {
      if (el.tagName === 'H3') return el;
      if (el.tagName === 'DT') {
        var h = el.querySelector('h3');
        if (h) return h;
      }
      el = el.previousElementSibling;
    }
    return null;
  }

  /** 링크가 들어 있는 폴더 경로: [최상위, 하위, 하위하위…] */
  function folderChain(a) {
    var chain = [];
    var dl = a.closest('dl');
    while (dl) {
      var h3 = folderTitleOf(dl);
      if (h3) chain.unshift((h3.textContent || '').trim());
      var up = dl.parentElement ? dl.parentElement.closest('dl') : null;
      dl = up && up !== dl ? up : null;
    }
    return chain.filter(Boolean);
  }

  function parseBookmarks(text) {
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var out = [];
    $$('a[href]', doc).forEach(function (a) {
      var href = a.getAttribute('href') || '';
      if (!/^https?:\/\//i.test(href)) return;
      var name = (a.textContent || '').trim() || hostOf(href);
      var chain = folderChain(a);
      while (chain.length && ROOT_FOLDERS.indexOf(chain[0].toLowerCase()) >= 0) chain.shift();
      var cat = chain[0] || '가져온 북마크';
      var group = chain.slice(1).join(' › ');
      out.push({ cat: cat, group: group, name: name, url: href, icon: guessIcon(href) });
    });
    return out;
  }

  function importFlow(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var found = parseBookmarks(String(reader.result || ''));
      if (!found.length) { toast('북마크를 찾지 못했습니다. 브라우저에서 내보낸 HTML 파일인지 확인해 주세요.', true); return; }
      var have = {};
      state.data.links.forEach(function (l) { have[l.url.replace(/\/$/, '')] = true; });
      var fresh = [], dup = 0;
      found.forEach(function (f) {
        var key = f.url.replace(/\/$/, '');
        if (have[key]) { dup++; return; }
        have[key] = true;
        fresh.push(f);
      });
      openModal(
        '<div class="sh-head"><h3>북마크 가져오기</h3><button class="x" id="mX">✕</button></div>' +
        '<p style="font-size:13.5px;margin:0 0 10px">북마크 <b>' + found.length + '</b>개를 찾았습니다.<br>' +
        '새로 추가 <b>' + fresh.length + '</b>개 · 이미 있어서 건너뜀 <b>' + dup + '</b>개</p>' +
        '<p style="font-size:12.5px;color:var(--mut);margin:0 0 12px">폴더 구조를 그대로 살립니다 — <b>최상위 폴더 → 카테고리</b>, <b>그 안의 하위 폴더 → 소그룹</b>.</p>' +
        '<label class="chk"><input type="checkbox" id="impPin" /> 폴더와 상관없이 전부 “가져온 북마크”로</label>' +
        '<div class="sh-foot"><button class="btn" id="mCancel">취소</button>' +
        '<button class="btn primary" id="impGo"' + (fresh.length ? '' : ' disabled style="opacity:.5"') + '>' + fresh.length + '개 가져오기</button></div>'
      );
      $('#mX').onclick = $('#mCancel').onclick = closeModal;
      $('#impGo').onclick = function () {

          if (catIndex(cat) < 0) state.data.cats.push({ name: cat, color: COLORS[state.data.cats.length % COLORS.length], groups: [] });
          ensureGroup(cat, f.group);
          state.data.links.push({ id: uid(), cat: cat, group: f.group || '', name: f.name, icon: f.icon || '🔗', url: f.url, desc: '', pin: false });
        });
        closeModal();
        renderAll();

        toast(fresh.length + '개를 가져왔습니다');
