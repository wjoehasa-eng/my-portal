<!doctype html>
<html lang="ko" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#eef1f7" />
<meta name="portal-version" content="3.3.2" />
<title>나만의 포털</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#eef1f8; --panel:#fff; --panel2:#f5f7fc; --txt:#0d1526; --mut:#5f6d85;
    --line:#e3e8f1; --acc:#3b5bfd; --acc2:#7c4dff; --acc-ink:#fff; --acc-soft:#eaefff;
    --danger:#e5484d; --ok:#0e9f86;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 8px -4px rgba(16,24,40,.10);
    --shadow:0 2px 4px rgba(16,24,40,.04), 0 18px 32px -22px rgba(16,24,40,.34);
    --r:18px; --r-sm:12px; --tile:#f2f4f7;
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#080b11; --panel:#121823; --panel2:#171f2c; --txt:#e9eff9; --mut:#94a4bb;
      --line:#222c3c; --acc:#7aa2ff; --acc2:#a78bfa; --acc-ink:#08111f; --acc-soft:#18233a;
      --danger:#ff6b6b; --ok:#2ec4b6;
      --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.6);
      --shadow:0 2px 4px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.95);
      --tile:#1b2231;
    }
  }
  html[data-theme="light"]{
    --bg:#eef1f8; --panel:#fff; --panel2:#f5f7fc; --txt:#0d1526; --mut:#5f6d85;
    --line:#e3e8f1; --acc:#3b5bfd; --acc2:#7c4dff; --acc-ink:#fff; --acc-soft:#eaefff;
    --danger:#e5484d; --ok:#0e9f86;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 8px -4px rgba(16,24,40,.10);
    --shadow:0 2px 4px rgba(16,24,40,.04), 0 18px 32px -22px rgba(16,24,40,.34);
  }
  html[data-theme="dark"]{
    --bg:#080b11; --panel:#121823; --panel2:#171f2c; --txt:#e9eff9; --mut:#94a4bb;
    --line:#222c3c; --acc:#7aa2ff; --acc2:#a78bfa; --acc-ink:#08111f; --acc-soft:#18233a;
    --danger:#ff6b6b; --ok:#2ec4b6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 2px 8px -4px rgba(0,0,0,.6);
    --shadow:0 2px 4px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.95);
    --tile:#1b2231;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:
      radial-gradient(1100px 420px at 50% -160px, color-mix(in srgb, var(--acc) 12%, transparent), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  body.disconnected .searchbox,body.disconnected #btnEdit{display:none !important}
  body.disconnected .editbar{display:none !important}
  .wrap{max-width:1340px;margin:0 auto;padding:0 18px}
  @media (max-width:640px){ .wrap{padding:0 12px} }

  /* ---------- header ---------- */
  header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--bg) 78%, transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb, var(--line) 80%, transparent)}
  .top-in{display:flex;align-items:center;gap:12px;height:62px}
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .logo{font-size:21px;line-height:1}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 10px 0 14px;height:42px;max-width:540px;box-shadow:var(--shadow-sm);transition:border-color .15s, box-shadow .15s}
  .searchbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
  .searchbox .mag{opacity:.5;font-size:14px}
  .searchbox input{flex:1;border:0;outline:0;background:transparent;min-width:0;font-size:14.5px}
  .searchbox input::placeholder{color:var(--mut)}
  .searchbox kbd{font:inherit;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel2)}
  .tools{display:flex;align-items:center;gap:7px;margin-left:auto}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);padding:0 10px;height:30px;border-radius:999px;white-space:nowrap}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.45}
  .status.saving .dot{background:var(--acc);opacity:1;animation:pulse 1s infinite}
  .status.syncing .dot{background:var(--acc2);opacity:1;animation:pulse 1.1s infinite}
  .status.editing{color:var(--acc);background:var(--acc-soft)}
  .status.editing .dot{background:var(--acc);opacity:1}
  .status.saved{color:var(--ok)}
  .status.saved .dot{background:var(--ok);opacity:1}
  .status.error{color:var(--danger);cursor:pointer}
  .status.error .dot{background:var(--danger);opacity:1}
  @keyframes pulse{0%,100%{transform:scale(.78);opacity:.5}50%{transform:scale(1.2);opacity:1}}
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:15px;box-shadow:var(--shadow-sm);transition:background .15s,transform .06s}
  .icon-btn:hover{background:var(--panel2)}
  .icon-btn:active{transform:scale(.96)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,transform .06s}
  .btn:hover{background:var(--panel2)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--acc);border-color:transparent;color:var(--acc-ink);box-shadow:0 6px 16px -10px var(--acc)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
  .btn.danger{color:var(--danger)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}

  /* ---------- banner ---------- */
  .banner{margin:14px 0 0;display:flex;align-items:center;gap:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb, var(--acc) 28%, transparent);color:var(--txt);border-radius:var(--r-sm);padding:11px 14px;font-size:13.5px}
  .banner .b-txt{flex:1}

  /* ---------- edit bar ---------- */
  .editbar{position:sticky;top:62px;z-index:35;margin:14px 0 0}
  .eb-in{display:flex;align-items:center;gap:12px;border-radius:14px;padding:11px 14px;
    background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--panel)),color-mix(in srgb,var(--acc2) 12%,var(--panel)));
    border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);box-shadow:var(--shadow)}
  .eb-ico{font-size:20px;line-height:1}
  .eb-txt{flex:1;min-width:0;font-size:13.5px;font-weight:650}
  .eb-txt b{font-weight:800}
  .eb-sub{display:block;font-size:12.5px;font-weight:500;color:var(--mut);margin-top:2px}
  .eb-act{display:flex;gap:8px;flex:none}

  /* ---------- 알약형 카테고리 탭 ---------- */
  .tabs{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;height:36px;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:750;letter-spacing:-.2px;
    color:var(--mut);background:transparent;border:1px solid transparent;white-space:nowrap;
    transition:background .14s,color .14s,border-color .14s,transform .06s}
  .tab:hover{background:var(--panel2);color:var(--txt)}
  .tab:active{transform:scale(.97)}
  .tab.on{background:#e8ecff;color:#3b4bd8;border-color:#dfe4ff}
  html[data-theme="dark"] .tab.on{background:#1c2540;color:#b8c4ff;border-color:#26314f}
  @media (prefers-color-scheme: dark){ html[data-theme="auto"] .tab.on{background:#1c2540;color:#b8c4ff;border-color:#26314f} }

  /* ---------- 하나의 흰 카드(surface) ---------- */
  .surface{background:var(--panel);border:1px solid var(--line);border-radius:24px;
    box-shadow:0 1px 2px rgba(16,24,40,.04), 0 24px 60px -34px rgba(16,24,40,.35);
    padding:16px 18px 8px;margin:4px 0 10px}
  @media (max-width:640px){ .surface{padding:12px 10px 4px;border-radius:20px} }

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px 26px;align-items:start}
  .board.only{grid-template-columns:1fr}
  #root{display:block}
  .panel{position:relative;padding:2px 0 8px;overflow:visible;min-width:0}
  .ph{display:flex;align-items:center;gap:5px;padding:8px 2px;position:relative;min-height:42px}
  .ph h2{font-size:15px;font-weight:800;letter-spacing:-.35px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:58%}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));flex:none;margin:0 1px 0 2px}
  .ph .ph-sp{flex:1;min-width:4px}
  .cnt{font-size:11px;font-weight:800;color:var(--mut);background:var(--panel2);border-radius:999px;padding:1px 8px;flex:none;line-height:1.6}
  .collapser{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:var(--mut);flex:none;transition:background .12s,color .12s,transform .08s}
  .collapser:hover{background:var(--acc-soft);color:var(--acc)}
  .collapser:active{transform:scale(.9)}
  .cat-grip{width:18px;height:26px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mut);opacity:.25;cursor:grab;flex:none;touch-action:none;user-select:none}
  .ph:hover .cat-grip{opacity:.75}
  .open-mini{width:28px;height:28px;border-radius:8px;font-size:12px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;opacity:.75;border:1px solid transparent;transition:opacity .12s,background .12s,border-color .12s,color .12s}
  .open-mini:hover{opacity:1;background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 35%,transparent);color:var(--acc)}
  .open-mini.pinbtn.on{opacity:1;color:#eab308}
  .add-mini{width:28px;height:28px;border-radius:8px;font-size:15px;color:var(--mut);display:flex;align-items:center;justify-content:center;flex:none;opacity:0;transition:opacity .12s,background .12s}
  .panel:hover .add-mini,body.editing .add-mini{opacity:1}
  .add-mini:hover{background:var(--panel2);color:var(--txt)}

  /* ---------- 아이콘 타일 그리드 (웨일 새 탭 느낌) ---------- */
  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px 2px;padding:2px 0 10px;align-items:start}
  .plist>.grp{grid-column:1/-1}
  .lk,.solo{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:8px 4px 7px;border-radius:16px;border:1px solid transparent;cursor:pointer;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    transition:background .12s,border-color .12s,transform .1s}
  .lk:hover,.solo:hover{background:var(--panel2);border-color:var(--line)}
  .lk:active,.solo:active{transform:scale(.985)}
  .lk:focus-visible,.solo:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .lk .ico,.solo .ico{position:relative;width:60px;height:60px;border-radius:18px;background:var(--tile);
    display:flex;align-items:center;justify-content:center;font-size:25px;line-height:1;flex:none;overflow:hidden}
  .ico .em{display:block;font-size:27px;line-height:1}
  .ico .fv{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;padding:13px;
    background:var(--tile);opacity:0;transition:opacity .18s}
  .ico .fv.on{opacity:1}
  .ico .fv.uv{object-fit:cover;padding:0}
  .ico .bdg{position:absolute;right:0;bottom:0;width:19px;height:19px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(9,14,20,.3);overflow:hidden;z-index:2}
  .ico .bdg img{width:13px;height:13px;object-fit:contain;display:block}
  .lk img,.solo img,.ico img{-webkit-user-drag:none;user-select:none}
  .lk .nm,.solo .nm{font-size:12.5px;font-weight:650;letter-spacing:-.15px;text-align:center;
    width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
  .lk .go,.solo .go{display:none}
  .lk.drop-src,.solo.drop-src{opacity:.3;border-style:dashed;border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:var(--acc-soft)}
  .plist>.empty-msg{grid-column:1/-1;font-size:12.5px;color:var(--mut);padding:18px 8px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;margin:2px 0 8px}
  .panel.is-collapsed .plist,.panel.is-collapsed .ed-head,.panel.is-collapsed .add-group{display:none}
  .panel.is-collapsed .ph{padding-bottom:8px}

  /* 타일 위 편집 도구 */
  .lk .ctools,.solo .ctools{position:absolute;top:2px;right:2px;display:flex;gap:0;z-index:3;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-sm);
    opacity:0;transition:opacity .12s}
  .lk:hover .ctools,.solo:hover .ctools,body.editing .lk .ctools,body.editing .solo .ctools{opacity:1}
  .lk .ctools button,.solo .ctools button{width:20px;height:20px;border-radius:6px;font-size:10px;
    display:flex;align-items:center;justify-content:center;opacity:.85;padding:0}
  .lk .ctools button:hover,.solo .ctools button:hover{background:var(--panel2);opacity:1}

  /* ---------- 소그룹(하위 층위) ---------- */
  .grp{position:relative;grid-column:1/-1;margin:2px 0 8px}
  .grp+.grp{margin-top:2px}
  .grp-head{display:flex;align-items:center;gap:6px;width:100%;padding:3px 8px 3px 3px;border-radius:10px;text-align:left;
    background:var(--panel2);border:1px solid var(--line);
    font-size:11.5px;font-weight:800;letter-spacing:.1px;color:var(--mut);
    transition:background .12s,border-color .12s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;touch-action:pan-y}
  .grp-head:hover{background:color-mix(in srgb,var(--txt) 6%,var(--panel2));border-color:color-mix(in srgb,var(--txt) 14%,var(--line))}
  .grp-head .gchev-btn{width:22px;height:22px;border-radius:7px;border:0;background:transparent;font-size:10px;font-weight:900;color:inherit;display:flex;align-items:center;justify-content:center;flex:none}
  .grp-head .gchev-btn:hover{background:var(--acc-soft);color:var(--acc)}
  .grp-head .gname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;cursor:text}
  .grp-head .gcnt{font-size:10px;font-weight:800;opacity:.7;flex:none}
  .grp-head .gbtn{width:22px;height:22px;border-radius:6px;font-size:10px;opacity:.55;display:flex;align-items:center;justify-content:center;flex:none}
  .grp-head .gbtn:hover{opacity:1;background:color-mix(in srgb,var(--txt) 8%,transparent)}
  .grp-head .gbtn.gopen:hover{color:var(--acc)}
  .grp-head .gbtn.del:hover{color:var(--danger)}
  .grp-head .gbtn.gpin{opacity:.4}
  .grp-head .gbtn.gpin.on{opacity:1;color:#eab308}
  /* 즐겨찾기 탭에 놓인 항목 */
  .pin-panel .pin-cat{border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
  .pin-panel .pin-cat:first-child{border-top:0;padding-top:0;margin-top:0}
  .pin-panel .pin-cat>.grp-head{background:color-mix(in srgb,var(--c,var(--acc)) 10%,var(--panel2));border-style:solid}
  .pin-panel .pin-grp>.grp-head{border-style:solid}
  .grp.drop-into .grp-head{border-style:solid;border-color:var(--acc);background:var(--acc-soft);color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
  .grp-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px 4px;padding:4px 0 4px 6px;margin-left:2px}
  .grp-body>.grp{margin:2px 0 6px 8px;padding-left:7px;border-left:2px solid color-mix(in srgb,var(--c,var(--acc)) 16%,transparent)}
  .grp-body>.grp>.grp-head{background:color-mix(in srgb,var(--c,var(--acc)) 5%,var(--panel2))}
  .grp[data-depth="3"]>.grp-head,.grp[data-depth="4"]>.grp-head,.grp[data-depth="5"]>.grp-head{font-size:11px}
  .grp.drop-src{opacity:.4}
  .grp-body:empty{min-height:4px}
  body.editing .grp-body:empty{min-height:44px;border:1.5px dashed var(--line);border-radius:14px;background:color-mix(in srgb,var(--acc) 3%,transparent)}
  .grp.is-collapsed .grp-body{display:none}
  .grp-head.drop-end{box-shadow:inset 0 -4px 0 var(--acc), 0 0 12px color-mix(in srgb,var(--acc) 45%,transparent)}
  .grp-body.drop-end::after{content:"";grid-column:1/-1;height:4px;border-radius:4px;margin-top:2px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent)}
  .grp.drop-zone .grp-head{border-style:solid;border-color:color-mix(in srgb,var(--acc) 65%,var(--line));background:var(--acc-soft);color:var(--acc)}
  .add-group{display:flex;align-items:center;justify-content:center;gap:5px;margin:0 0 10px;height:30px;border-radius:10px;
    border:1.5px dashed color-mix(in srgb,var(--txt) 16%,var(--line));color:var(--mut);font-size:12px;font-weight:700}
  .add-group:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
  body.editing .panel{background:color-mix(in srgb,var(--acc) 2%,transparent)}
  body.editing .lk,body.editing .solo{cursor:grab}

  /* edit head */
  .ed-head{display:flex;align-items:center;gap:6px;padding:0 2px 10px}
  .ph input.cat-name{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:9px;height:30px;padding:0 9px;font-size:14px;font-weight:750}
  .ph input.cat-name:focus{outline:0;border-color:var(--acc);background:var(--panel);box-shadow:0 0 0 3px var(--acc-soft)}
  .dots{display:flex;gap:5px;align-items:center}
  .dots button{width:16px;height:16px;border-radius:50%;border:2px solid transparent;background:var(--dc);transition:transform .08s}
  .dots button:hover{transform:scale(1.2)}
  .dots button.on{border-color:var(--txt);box-shadow:0 0 0 1px var(--panel) inset}
  .ed-head .spacer{flex:1}
  .ed-head .mini{height:28px;min-width:28px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700}
  .ed-head .mini:hover{background:var(--panel2)}
  .ed-head .mini.danger{color:var(--danger)}
  .ed-head .mini:disabled{opacity:.35}

  /* ---------- 단독 페이지 (카테고리 밖 · surface 상단) ---------- */
  .solo-strip{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px 4px;padding:4px 0 12px;align-items:start}
  .solo-strip.has-cats{border-bottom:1px dashed var(--line);margin-bottom:4px}
  .solo-strip.has-folders{padding-bottom:14px}
  .solo-strip>.grp{margin:2px 0 8px}
  .solo-strip>.add-group{grid-column:1/-1;margin:2px 0 8px}
  .solo-strip>.empty-msg{grid-column:1/-1;font-size:12.5px;color:var(--mut);padding:16px 10px;text-align:center;
    border:1.5px dashed var(--line);border-radius:16px;margin:2px 0 8px}
  /* 단독 페이지 영역의 폴더 머리 — 카테고리 안 폴더와 같은 톤, 살짝 다른 점선 테두리 */
  .solo-strip>.grp>.grp-head{border-style:dashed}
  .solo.drop-into{border-style:dashed;border-color:var(--acc);background:var(--acc-soft)}
  #soloZone{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:170;display:none;pointer-events:none;
    padding:13px 22px;border:2px dashed var(--ok);border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--panel));
    color:var(--ok);font-size:13.5px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}

  /* ---------- drop indicators ---------- */
  .lk.drop-before::before,.lk.drop-after::after{
    content:"";position:absolute;left:2px;right:2px;height:4px;border-radius:4px;z-index:5;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent);
  }
  .lk.drop-before::before{top:-3px}
  .lk.drop-after::after{bottom:-3px}
  .lk.drop-before::after,.lk.drop-after::before{content:none}
  .lk.drop-before,.lk.drop-after{z-index:2}
  .plist.drop-end{position:relative}
  .plist.drop-end::after{
    content:"";position:absolute;left:10px;right:10px;bottom:4px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 26%,transparent), 0 0 16px 2px color-mix(in srgb,var(--acc) 75%,transparent);
  }
  .panel.drop-zone{border-color:color-mix(in srgb,var(--acc) 65%,var(--line));background:color-mix(in srgb,var(--acc) 4%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent),var(--shadow)}
  .panel.cat-before{box-shadow:inset 4px 0 0 var(--acc), 0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .panel.cat-after{box-shadow:inset -4px 0 0 var(--acc), 0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
  .drag-ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;display:flex;align-items:center;gap:10px;
    height:50px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--acc) 45%,var(--line));
    box-shadow:0 18px 36px -16px rgba(16,24,40,.55), 0 0 0 4px color-mix(in srgb,var(--acc) 12%,transparent);
    font-weight:700;font-size:15px;transform-origin:center;will-change:transform;opacity:.97}
  .drag-ghost .ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--acc-soft);flex:none}
  .drag-ghost .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drag-ghost.cat{height:42px;font-size:14px;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0}
  .drag-ghost.cat .gl{opacity:.8;font-size:14px}
  .drag-ghost.grp{height:38px;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--acc) 10%,var(--panel));border-style:dashed}
  html.dragging{cursor:grabbing !important}
  html.dragging *{cursor:grabbing !important}

  /* ---------- precise drop line + action badge ---------- */
  #dropLine{position:fixed;z-index:185;display:none;pointer-events:none;border-radius:6px;
    background:linear-gradient(90deg,var(--acc),var(--acc2));
    box-shadow:0 0 0 3px color-mix(in srgb,var(--panel) 88%,transparent),0 0 0 6px color-mix(in srgb,var(--acc) 38%,transparent),0 0 20px 4px color-mix(in srgb,var(--acc) 75%,transparent)}
  #dropLine.h{height:8px}
  #dropLine.v{width:8px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
  #dropBadge{position:fixed;z-index:186;pointer-events:none;max-width:min(78vw,340px);padding:7px 12px;border-radius:999px;
    background:var(--txt);color:var(--bg);font-size:12.5px;font-weight:800;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 10px 26px -12px rgba(0,0,0,.65)}
  #dropBadge.into{background:var(--acc);color:#fff}
  #dropBadge.out{background:var(--ok);color:#fff}
  #promoteZone{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:170;display:none;pointer-events:none;
    padding:13px 22px;border:2px dashed var(--ok);border-radius:14px;background:color-mix(in srgb,var(--ok) 14%,var(--panel));
    color:var(--ok);font-size:13.5px;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
  .panel.drop-into{border-color:var(--acc);border-style:dashed;background:color-mix(in srgb,var(--acc) 6%,var(--panel));box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent),var(--shadow)}
  .panel.cat-src{opacity:.5}

  /* ---------- inline rename ---------- */
  input.in-rename{height:28px;border:1px solid var(--acc);border-radius:8px;background:var(--panel);padding:0 8px;font-size:13.5px;font-weight:750;color:var(--txt);outline:0;min-width:0;box-shadow:0 0 0 3px var(--acc-soft)}
  .grp-head input.in-rename{height:25px;font-size:12px;font-weight:800}

  /* ---------- context menu ---------- */
  #ctxMenu{position:fixed;z-index:300;min-width:230px;max-width:min(92vw,300px);max-height:min(76vh,460px);overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px -18px rgba(8,12,20,.55);padding:6px;display:flex;flex-direction:column;gap:1px}
  #ctxMenu .chead{padding:6px 10px 5px;font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  #ctxMenu .ci{ display:flex;align-items:center;gap:9px;min-height:38px;padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:650;text-align:left;white-space:nowrap}
  #ctxMenu .ci:hover{background:var(--panel2)}
  #ctxMenu .ci .ic{width:18px;text-align:center;flex:none;opacity:.9}
  #ctxMenu .ci.danger{color:var(--danger)}
  #ctxMenu .ci.danger:hover{background:color-mix(in srgb,var(--danger) 10%,transparent)}
  #ctxMenu .sep{height:1px;background:var(--line);margin:4px 2px}

  #toasts{pointer-events:none}
  .toast{display:flex;align-items:center;gap:8px;pointer-events:none;white-space:normal;line-height:1.35;text-align:left}
  .toast.act{pointer-events:auto}
  .toast .tact{border:0;background:transparent;color:currentColor;font-weight:900;text-decoration:underline;text-underline-offset:2px;padding:2px 4px;font-size:13px;flex:none}

  /* ---------- add category tile ---------- */
  .addcat-tile{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;margin:2px 0 6px;
    border:1.5px dashed color-mix(in srgb,var(--acc) 35%,var(--line));border-radius:14px;color:var(--mut);font-size:13.5px;font-weight:700;background:color-mix(in srgb,var(--acc) 3%,transparent)}
  .addcat-tile:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}

  /* ---------- search results ---------- */
  .results{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:18px 0 28px;overflow:hidden}
  .results .rh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mut)}
  .res{display:flex;align-items:center;gap:11px;padding:11px 16px;border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);min-height:54px}
  .res:hover,.res.sel{background:var(--acc-soft)}
  .res .ico{position:relative;flex:none;width:40px;height:40px;border-radius:12px;background:var(--tile);
    display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}
  .res .ico .em{font-size:20px;line-height:1}
  .res .ico .fv{padding:6px}
  .res .ico .fv.uv{padding:0}
  .res .ico .bdg{width:15px;height:15px;right:0;bottom:0}
  .res .ico .bdg img{width:10px;height:10px}
  .res .nm{font-weight:650;font-size:14.5px}
  .res .tag{font-size:11px;font-weight:800;color:var(--c,var(--acc));background:color-mix(in srgb, var(--c,var(--acc)) 13%, transparent);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .res .ds{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .k{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap}

  /* ---------- skeleton ---------- */
  .sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(296px,1fr));gap:16px;margin:20px 0}
  .sk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
  .sk i{display:block;height:13px;border-radius:7px;margin-bottom:10px;background:linear-gradient(90deg,var(--line) 25%,var(--panel2) 50%,var(--line) 75%);background-size:400% 100%;animation:sh 1.5s ease-in-out infinite}
  .sk i.t{height:20px;width:52%;margin-bottom:14px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}

  /* ---------- connect / empty ---------- */
  .center{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:24px 0}
  .card-lg{width:100%;max-width:580px;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:30px}
  .card-lg h2{margin:0 0 6px;font-size:22px;letter-spacing:-.5px}
  .card-lg p.lead{margin:0 0 18px;color:var(--mut);font-size:13.5px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
  .field label{font-size:12px;font-weight:700;color:var(--mut)}
  .field input,.field select,.field textarea{height:42px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);padding:0 13px;font-size:14px;outline:0;width:100%}
  .field textarea{height:auto;padding:9px 13px;resize:vertical;min-height:64px;line-height:1.4}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc);background:var(--panel);box-shadow:0 0 0 3px var(--acc-soft)}
  .field .hint{font-size:11.5px;color:var(--mut)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .steps{margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
  .steps li{counter-increment:s;position:relative;padding:0 0 10px 32px;font-size:13px;color:var(--txt)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--acc-soft);color:var(--acc);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .steps code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  .empty{text-align:center;padding:38px 16px}
  .empty .big{font-size:38px}
  .empty h3{margin:10px 0 5px;font-size:17px}
  .empty p{margin:0 0 18px;color:var(--mut);font-size:13.5px}
  .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  /* ---------- modal ---------- */
  .ovl{position:fixed;inset:0;background:rgba(8,12,20,.45);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:120;padding:0}
  @media (min-width:640px){.ovl{align-items:center;padding:20px}}
  .sheet{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;border:1px solid var(--line);box-shadow:0 24px 70px -24px rgba(0,0,0,.55);padding:20px}
  @media (min-width:640px){.sheet{border-radius:20px}}
  .sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .sh-head h3{margin:0;font-size:17px;flex:1;letter-spacing:-.3px}
  .sh-head .x{width:34px;height:34px;border-radius:10px;font-size:15px;color:var(--mut);display:flex;align-items:center;justify-content:center}
  .sh-head .x:hover{background:var(--panel2);color:var(--txt)}
  .sh-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:8px 0}
  .chk input{width:18px;height:18px;accent-color:var(--acc)}
  .chk.dis{opacity:.45}
  .chk.reset{margin-top:4px;padding-top:8px;border-top:1px dashed var(--line)}
  .chk.reset b{color:#dc2626}
  .imp-warn{color:#dc2626;font-size:12.5px;font-weight:700;line-height:1.45;margin:0 0 4px}
  .imp-warn.hidden{display:none}
  .ico-row{display:flex;align-items:center;gap:8px}
  .ico-row .ico-mini{width:42px;height:42px;border-radius:12px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
  .ico-row input{flex:1;min-width:0}
  .ico-row .btn{flex:none;height:38px;padding:0 11px}
  .ico-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ico-acts .btn{height:34px;padding:0 11px;font-size:12.5px}
  #mIconPrev.has-img{padding:0;overflow:hidden;background:var(--tile)}
  #mIconPrev.has-img img{width:100%;height:100%;object-fit:cover;display:block}
  #mIconPrev{position:relative}
  #mIconPrev .bdg{position:absolute;right:-2px;bottom:-2px;width:17px;height:17px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(9,14,20,.25);overflow:hidden}
  #mIconPrev .bdg img{width:11px;height:11px;object-fit:contain;display:block}
  .ico-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .ico-pick button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:17px;display:flex;align-items:center;justify-content:center}
  .ico-pick button:hover{border-color:var(--acc)}
  /* 이모지 팔레트 — 그룹 칩 + 좁은 스크롤 그리드 */
  .emoji-box{margin-top:8px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);padding:7px 8px 8px}
  .emoji-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .emoji-chips button{height:24px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
    font-size:11.5px;font-weight:750;color:var(--mut);white-space:nowrap}
  .emoji-chips button:hover{border-color:var(--acc);color:var(--acc)}
  .emoji-chips button.on{background:var(--acc);border-color:transparent;color:var(--acc-ink)}
  .emoji-pad{max-height:158px;overflow-y:auto;overscroll-behavior:contain;padding-right:3px;scrollbar-width:thin}
  .emoji-pad .egrp+.egrp{margin-top:2px}
  .emoji-pad .egrp-t{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.2px;padding:3px 2px 3px}
  .emoji-pad .egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(31px,1fr));gap:2px}
  .emoji-pad .egrid button{width:100%;aspect-ratio:1/1;min-height:29px;border-radius:8px;border:1px solid transparent;
    background:var(--panel);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center}
  .emoji-pad .egrid button:hover{border-color:var(--acc);background:var(--acc-soft)}
  .emoji-pad .egrid button:active{transform:scale(.94)}
  .menu-pop{position:fixed;z-index:60;display:flex;flex-direction:column;gap:2px;padding:6px;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .menu-pop .btn{justify-content:flex-start;box-shadow:none}

  /* ---------- toast ---------- */
  #toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:200;align-items:center;pointer-events:none}
  .toast{background:var(--txt);color:var(--bg);font-size:13px;font-weight:650;padding:10px 16px;border-radius:999px;box-shadow:0 10px 26px -14px rgba(0,0,0,.7);animation:tin .18s ease-out;max-width:92vw;text-align:center}
  .toast.err{background:var(--danger);color:#fff}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  footer.foot{border-top:1px solid var(--line);padding:16px 0 30px;color:var(--mut);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:20px}
  footer.foot a:hover{color:var(--txt);text-decoration:underline}
  footer.foot .sep{opacity:.4}

  @media (max-width:900px){
    .fold-btn .lbl{display:none}
    .fold-btn{width:38px;padding:0}
    .status .txt{display:none}
  }
  @media (max-width:820px){
    .top-in{height:auto;padding:9px 0;flex-wrap:wrap;gap:8px}
    .brand{order:1}
    .tools{order:2;margin-left:auto;gap:5px}
    .searchbox{order:3;flex-basis:100%;max-width:none;height:44px}
    .brand h1{max-width:170px;font-size:16px}
    .pins-label{display:none}
    .pinbar{margin:14px 0 0}
    .board{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:13px}
    .editbar{top:0;position:static;margin:12px 0 0}
    .eb-in{flex-wrap:wrap;gap:8px}
    .eb-ico{display:none}
    .eb-txt{flex-basis:100%;order:1}
    .eb-act{order:2;width:100%;margin-top:2px}
    .eb-act .btn{flex:1}
    .cnt{display:none}
    .ph{gap:4px;padding-right:8px}
    .ph h2{font-size:15px}
    .add-mini{opacity:.75}
  }
  @media (max-width:480px){
    .status{display:none}
    .brand h1{max-width:132px;font-size:15px}
    .tools{gap:4px}
    .icon-btn{width:36px;height:36px}
    .btn{height:36px;padding:0 11px}
  }
  @media (max-width:720px){
    .lk,.solo{height:auto}
    .lk .ctools button,.solo .ctools button{width:20px;height:20px;font-size:10px}
    .plist,.solo-strip,.grp-body{grid-template-columns:repeat(auto-fill,minmax(86px,1fr))}
    .lk .ico,.solo .ico{width:52px;height:52px;border-radius:16px}
    .ico .fv{width:28px;height:28px}
    .ph h2{font-size:14.5px}
    .ph{min-height:40px}
  }
  @media (max-width:720px){
    .top-in{height:auto;padding:9px 0;flex-wrap:wrap;gap:8px}
    .brand{order:1}
    .tools{order:2;margin-left:auto;gap:5px}
    .searchbox{order:3;flex-basis:100%;max-width:none;height:44px}
    .brand h1{max-width:150px;font-size:16px}
    .status{padding:0 6px}
    .status .txt{display:none}
    .editbar{top:0;position:static;margin:12px 0 0}
    .eb-in{flex-wrap:wrap;gap:8px}
    .eb-ico{display:none}
    .eb-txt{flex-basis:100%;order:1}
    .eb-act{order:2;width:100%;margin-top:2px}
    .eb-act .btn{flex:1}
    .board{grid-template-columns:1fr;gap:12px}
    .pin{height:54px;font-size:14.5px;padding:0 16px 0 13px}
    .pin .pi{font-size:20px}
    .pins-label{display:none}
    .pinbar{margin:14px 0 0}
    .card-lg{padding:24px 18px;border-radius:18px}
    .lk{height:54px}
    .cat-grip{opacity:.5}
    .add-mini{opacity:1}
    .row2{grid-template-columns:1fr}
    .ctools button{width:34px;height:34px;font-size:14px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="logo">🏠</span><h1 id="portalTitle">나만의 포털</h1></div>
    <div class="searchbox">
      <span class="mag">🔍</span>
      <input id="q" type="search" placeholder="이름·카테고리로 바로 찾기" autocomplete="off" spellcheck="false" aria-label="검색" />
      <kbd>/</kbd>
    </div>
    <div class="tools">
      <div class="status" id="status" title="저장 상태"><span class="dot"></span><span class="txt">자동 저장</span></div>
      <button class="btn fold-btn" id="btnFold" title="모두 접기">▾ <span class="lbl">모두 접기</span></button>
      <button class="btn" id="btnEdit" title="편집 모드 (삭제·수정은 여기서만)">✏️ <span>편집</span></button>
      <button class="icon-btn" id="btnTheme" title="테마 바꾸기">🌗</button>
      <button class="icon-btn" id="btnMenu" title="더보기" aria-haspopup="true">⋯</button>
    </div>
  </div>
</header>

<div class="wrap" id="bannerWrap"></div>
<div class="wrap" id="editBar"></div>

<main class="wrap" id="root"></main>

<footer class="foot wrap" id="foot"></footer>

<div class="ovl hidden" id="ovl"><div class="sheet" id="sheet"></div></div>

    var parts = p.split('/'), acc = '';

      if (!parts[i]) continue;
      acc = acc ? acc + '/' + parts[i] : parts[i];
      if (arr.indexOf(acc) < 0) arr.push(acc);
    }
    return arr;
  }

    if (Array.isArray(raw)) return raw.map(function (t) { return String(t || '').trim(); }).filter(Boolean);

    if (!d) return [];

    (d.links || []).forEach(function (l) {
      if (!isSolo(l)) return;
      var k = normKey(l.url);
      if (k && !soloByKey[k]) soloByKey[k] = 1;
    });
    (Array.isArray(d.board) ? d.board : []).forEach(function (tok) {
      tok = String(tok || '');
      if (tok.indexOf('s:') !== 0) return;
      var k = normKey(tok.slice(2));
      if (!soloByKey[k] || soloSeen[k]) return;
      soloSeen[k] = 1; out.push('s:' + k);
    });
    (d.links || []).forEach(function (l) {
      if (!isSolo(l)) return;
      var k = normKey(l.url);
      if (!k || soloSeen[k]) return;
      soloSeen[k] = 1; out.push('s:' + k);
    });
    (d.cats || []).forEach(function (c) { if (c && c.name) out.push('c:' + c.name); });
    d.board = out;
    return out;
  }

  function soloTokens(d) {
    return (d.board || []).filter(function (t) { return String(t).indexOf('s:') === 0; });
  }

  function setSoloTokens(d, arr) {
    d.board = arr.concat((d.cats || []).map(function (c) { return 'c:' + c.name; }));

    });
  }

  /** 응답을 읽을 수 없는 환경을 위한 숨은 폼 전송(성공 여부는 따로 확인). */
  function formPost(payload) {
    return new Promise(function (resolve, reject) {
      var name = 'pf' + Date.now();
      var iframe = document.createElement('iframe');
      iframe.name = name;
      iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden';
      var form = document.createElement('form');
      form.method = 'POST'; form.action = state.url; form.target = name; form.style.display = 'none';
      var input = document.createElement('input');
      input.type = 'hidden'; input.name = 'payload'; input.value = JSON.stringify(payload);
      form.appendChild(input);
      document.body.appendChild(iframe);
      document.body.appendChild(form);

      var done = false;
      var timer = setTimeout(function () { end(new Error('응답 없음')); }, 20000);
      function end(err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        if (form.parentNode) form.parentNode.removeChild(form);
        if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
        if (err) reject(err); else resolve({ ok: true });
      }
      iframe.onload = function () { setTimeout(function () { end(null); }, 60); };
      form.submit();
    });
  }

  function sameLinks(data, payload) {
    if (!data || !data.links) return false;
    var a = data.links.map(function (l) { return [l.category, l.name, l.url, l.pin ? 'Y' : 'N'].join('|'); });
    var b = (payload.links || []).map(function (l) { return [l.c, l.n, l.u, l.p].join('|'); });
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  /* ---------------------------------------------------------------- cache */
  function cacheKey() { return state.demo || !state.url ? '' : LS.cache + hashKey(state.url); }
  function collKey() { if (state.demo) return LS.collapsed + 'demo'; return !state.url ? '' : LS.collapsed + hashKey(state.url); }

  function readCache() {
    var k = cacheKey();
    if (!k) return null;
    try {
      var s = localStorage.getItem(k);
      if (!s) return null;
      var d = JSON.parse(s);
      if (!d || !d.links) return null;
      return d;
    } catch (e) { return null; }
  }

  function writeCache(d) {
    var k = cacheKey();
    if (!k || !d) return;
    try {
      localStorage.setItem(k, JSON.stringify({
        portalTitle: d.title, theme: d.theme, sheetUrl: state.sheetUrl,
        collapsed: d.collapsed, collapsedGroups: d.collapsedGroups,
        categories: categoriesForWire(d),
        board: (d.board || []).slice(),
        links: d.links.map(function (l) {
          return { category: l.cat, group: l.group || '', name: l.name, icon: l.icon, url: l.url, desc: l.desc, pin: l.pin ? 'Y' : 'N' };
        }),
        cachedAt: Date.now()
      }));
    } catch (e) {}
  }

  function persistCollapsed() {
    var k = collKey();
    if (k) lsSet(k, JSON.stringify((state.data && state.data.collapsed) || []));
  }

  /** 접힘 상태만 시트 설정에 바로 저장합니다(내용 편집과 무관). */
  function savePrefs() {
    if (state.demo || !state.url || !state.data) return;
    if (state.backendOld) return;
    savePrefsSoon();
  }
  var savePrefsSoon = debounce(function () {
    if (!state.data) return;
    var body = {
      collapsed: (state.data.collapsed || []).slice(),
      collapsedGroups: (state.data.collapsedGroups || []).slice()
    };
    jsonp({ action: 'setSettings', d: JSON.stringify(body) }).catch(function () {});
  }, 550);

  /* ---------------------------------------------------------------- boot */
  function boot() {
    var ltheme = lsGet(LS.theme);
    if (ltheme) document.documentElement.setAttribute('data-theme', ltheme);

    var qs = location.search.replace(/^\?/, '');
    var params = {};
    qs.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      params[decodeURIComponent(kv.slice(0, i < 0 ? kv.length : i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1));
    });

    var hash = location.hash.replace(/^#/, '');
    var conn = '';
    if (/^s=/.test(hash)) {
      var v = hash.slice(2);
      conn = /^https?:/i.test(v) ? v : b64decode(v);
    } else if (hash && /^https?:/i.test(hash)) {
      conn = hash;
    } else if (params.s) {
      conn = params.s;
    }

    if (params.demo === '1') { startDemo(); return; }

    var stored = lsGet(LS.url);
    if (conn) {
      state.url = conn;
      lsSet(LS.url, conn);
      state.connected = true;
      startWithCache(false);
      return;
    }
    if (stored) {
      state.url = stored;
      state.connected = true;
      startWithCache(false);
      return;
    }
    renderConnect();
  }

  /** 캐시가 있으면 0ms에 먼저 그리고, 뒤에서 조용히 최신으로 맞춥니다. */
  function startWithCache() {
    var cached = readCache();
    if (cached) {
      state.data = normalizeData(cached);
      state.data.collapsed = mergeCollapsed(state.data, cached.collapsed);
      try {
        var lsg = JSON.parse(lsGet(collKey() + 'g') || '[]') || [];
        lsg.forEach(function (k) {
          if (state.data.collapsedGroups.indexOf(k) < 0) state.data.collapsedGroups.push(k);
        });
      } catch (e) {}
      state.sheetUrl = cached.sheetUrl || '';
      renderAll();
      load({ silent: true });
      return;
    }
    renderSkeleton();
    load({ silent: false });
  }

  function mergeCollapsed(d, fromSheet) {
    var ls = [];
    try { ls = JSON.parse(lsGet(collKey()) || '[]') || []; } catch (e) {}
    var names = [];
    (Array.isArray(fromSheet) ? fromSheet : []).forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
    ls.forEach(function (n) { if (names.indexOf(n) < 0) names.push(n); });
    return names.filter(function (n) { return d.cats.some(function (c) { return c.name === n; }); });
  }

  function mergeCollapsedGroups(d) {
    var lsg = [];
    try { lsg = JSON.parse(lsGet(collKey() + 'g') || '[]') || []; } catch (e) {}
    (d.collapsedGroups || (d.collapsedGroups = [])).slice();
    lsg.forEach(function (k) {
      if (d.collapsedGroups.indexOf(k) < 0) d.collapsedGroups.push(k);
    });
    return d;
  }

  function startDemo() {
    state.demo = true;
    state.connected = false;
    state.data = normalizeData(DEMO);
    state.data.collapsed = mergeCollapsed(state.data, state.data.collapsed);
    mergeCollapsedGroups(state.data);
    loadTabCollapsed();
    renderAll();
    toast('데모 화면입니다. 끌어서 옮겨 보세요. (실제 시트에는 저장 안 됨)');
  }

  function load(opt) {
    opt = opt || {};
    var silent = !!opt.silent;
    var prevCache = readCache();
    if (!state.data && !silent) renderSkeleton();
    setSync('syncing');
    jsonp({ action: 'load' }).then(function (data) {
      if (!data || data.ok === false) throw new Error((data && data.error) || '불러오지 못했습니다.');
      var norm = normalizeData(data);
      state.sheetUrl = data.sheetUrl || state.sheetUrl;
      state.backendVersion = data.backendVersion || '';
      state.backendOld = !state.backendVersion || versionLt(state.backendVersion, '2.0.0');
      state.backendSolo = !!state.backendVersion && !versionLt(state.backendVersion, '2.1.0');
      norm.collapsed = mergeCollapsed(norm, norm.collapsed);
      mergeCollapsedGroups(norm);
      loadTabCollapsed();
      /* 시트에 최상위 배치가 없으면(예전 백엔드) 이 브라우저의 마지막 배치를 살려 둡니다. */
      var prevBoard = parseBoardTokens((prevCache && prevCache.board) || []);
      if (!String(data.boardOrder || '').trim() && prevBoard.length) {
        norm.board = prevBoard;
        syncBoard(norm);
      }
    /* 시트에 소그룹 정보가 하나도 없으면 이 브라우저의 마지막 배치를 살려 둡니다. */
      var anyGroup = norm.links.some(function (l) { return !!l.group; }) || (norm.soloGroups || []).length > 0;
      if (!anyGroup) mergeFromCache(norm, prevCache);
      setSync('idle');
      if (state.edit || state.dirty || state.inFlight) { state.remote = norm; return; }
      var first = !state.data;
      var changed = first || sig(norm) !== sig(state.data);
      state.data = norm;
      if (state.save !== 'saving') state.save = 'idle';
      state.dirty = false;
      writeCache(norm);
      if (first && !state.demo) state.banner = !lsGet(LS.banner);
      if (changed) renderAll();
      else paintStatus();
    }).catch(function (err) {
      setSync('idle');
      if (state.data) toast('동기화하지 못했습니다: ' + err.message, true);
      else renderConnect(err.message);
    });
  }

  function versionLt(a, b) {
    var pa = String(a || '').split('.'), pb = String(b || '').split('.');
    for (var i = 0; i < 3; i++) {
      var x = parseInt(pa[i], 10) || 0, y = parseInt(pb[i], 10) || 0;
      if (x < y) return true;
      if (x > y) return false;
    }
    return false;
  }

  /** 시트에 없는 소그룹 정보를 이 브라우저의 마지막 캐시에서 복원합니다. */
  function mergeFromCache(norm, cached) {
    if (!cached) return norm;
    var byUrl = {};
    (cached.links || []).forEach(function (l) { if (l.group) byUrl[String(l.url || '').replace(/\/$/, '')] = l.group; });
    norm.links.forEach(function (l) {
      if (!l.group) {
        var g = byUrl[l.url.replace(/\/$/, '')];
        if (g) l.group = g;
      }
    });
    norm.links.forEach(function (l) {
      if (!l.group) return;
      if (isSolo(l)) { pushPath(norm.soloGroups, l.group); return; }
      var c = null;
      for (var i = 0; i < norm.cats.length; i++) if (norm.cats[i].name === l.cat) { c = norm.cats[i]; break; }
      if (c && c.groups.indexOf(l.group) < 0) c.groups.push(l.group);
    });
    (cached.categories || []).forEach(function (c) {
      if (c.name === SOLO_KEY) {
        var rawSolo = (c.groups || []).slice();
        var decSolo = rawSolo.length === 1 ? decodeListBlob(rawSolo[0]) : null;
        (decSolo || rawSolo).forEach(function (g) { pushPath(norm.soloGroups, g); });
        return;
      }
      if (c.name === PIN_KEY) {
        var rawPin = (c.groups || []).slice();
        var decPin = rawPin.length === 1 ? decodeListBlob(rawPin[0]) : null;
        (decPin || rawPin).forEach(function (t) {
          var v = String(t || '').trim();
          if (v && (norm.pinOrder || []).indexOf(v) < 0) { norm.pinOrder = norm.pinOrder || []; norm.pinOrder.push(v); }
        });
        return;
      }
      var t = norm.cats.filter(function (x) { return x.name === c.name; })[0];
      if (!t) return;
      (c.groups || []).forEach(function (g) { if (t.groups.indexOf(g) < 0) t.groups.push(g); });
    });
    (cached.collapsedGroups || []).forEach(function (k) {
      if (norm.collapsedGroups.indexOf(k) < 0) norm.collapsedGroups.push(k);
    });
    return norm;
  }

  function sig(d) {
    if (!d) return '';
    return JSON.stringify([
      d.title, d.theme,
      d.cats.map(function (c) { return c.name + '|' + (c.color || '') + '|' + (c.groups || []).join(';'); }),
      (d.soloGroups || []).join(';'),
      (d.pinOrder || []).join(','),
      d.links.map(function (l) { return [l.cat, l.group || '', l.name, l.icon, l.url, l.desc, l.pin ? 1 : 0].join('|'); }),
      (syncBoard(d) || []).join('\n'),
      (d.collapsed || []).join(','),
      (d.collapsedGroups || []).join(',')
    ]);
  }

  function normalizeData(raw) {
    var cats = [];
    var soloGroups = [];
    var pinOrder = [];
    (raw.categories || raw.cats || []).forEach(function (c, i) {
      var name = typeof c === 'string' ? c : c.name;
      if (!name) return;
      var nm = String(name).trim();
      if (nm === SOLO_KEY) {
        /* 예약된 「단독 페이지 폴더」 목록입니다. 카테고리로 만들지 않습니다. */
        var rawSolo = ((typeof c === 'string' ? [] : (c.groups || [])) || []).slice();
        var decSolo = rawSolo.length === 1 ? decodeListBlob(rawSolo[0]) : null;
        (decSolo || rawSolo).forEach(function (g) { pushPath(soloGroups, g); });
        return;
      }
      if (nm === PIN_KEY) {
        /* 예약된 「즐겨찾기 순서」 토큰 목록입니다. */
        var rawPin = ((typeof c === 'string' ? [] : (c.groups || [])) || []).slice();
        var decPin = rawPin.length === 1 ? decodeListBlob(rawPin[0]) : null;
        (decPin || rawPin).forEach(function (t) {
          var v = String(t || '').trim();
          if (v && pinOrder.indexOf(v) < 0) pinOrder.push(v);
        });
        return;
      }
      if (cats.some(function (x) { return x.name === nm; })) return;
      var gs = [];
      ((typeof c === 'string' ? [] : (c.groups || [])) || []).forEach(function (g) {
        var s = String(g || '').trim();
        if (s && gs.indexOf(s) < 0) gs.push(s);
      });
      cats.push({ name: nm, color: (typeof c === 'string' ? '' : (c.color || '')) || COLORS[i % COLORS.length], groups: gs });
    });
    var links = [];
    (raw.links || []).forEach(function (l) {
      var url = normalizeUrl(l.url || l.u);
      if (!url) return;
      var cat = String(l.category || l.cat || l.c || '').trim();
      links.push({
        id: uid(),
        cat: cat,
        group: String(l.group || l.g || '').trim(),
        name: String(l.name || l.n || hostOf(url)).trim(),
        icon: String(l.icon || l.i || '🔗').trim() || '🔗',
        url: url,
        desc: String(l.desc || l.d || '').trim(),
        pin: l.pin === true || l.pin === 'Y' || l.p === 'Y' || l.p === true
      });
      if (cat && !cats.some(function (c) { return c.name === cat; })) cats.push({ name: cat, color: COLORS[cats.length % COLORS.length], groups: [] });
    });
    /* 링크에만 있는 소그룹도 카테고리 목록에 올려 둡니다. */
    links.forEach(function (l) {
      if (!l.group) return;
      if (isSolo(l)) { pushPath(soloGroups, l.group); return; }
      var c = null;
      for (var i = 0; i < cats.length; i++) if (cats[i].name === l.cat) { c = cats[i]; break; }
      if (c && c.groups.indexOf(l.group) < 0) c.groups.push(l.group);
    });
    var collapsed = [];
    (raw.collapsed || []).forEach(function (n) {
      var s = String(n).trim();
      if (s && collapsed.indexOf(s) < 0) collapsed.push(s);
    });
    var collapsedGroups = [];
    (raw.collapsedGroups || []).forEach(function (n) {
      var s = String(n).trim();
      if (s && collapsedGroups.indexOf(s) < 0) collapsedGroups.push(s);
    });
    if (raw.sheetUrl) state.sheetUrl = raw.sheetUrl;
    var out = {
      title: String(raw.portalTitle || '나만의 포털'),
      theme: ['auto', 'light', 'dark'].indexOf(raw.theme) >= 0 ? raw.theme : 'auto',
      cats: cats, links: links, collapsed: collapsed, collapsedGroups: collapsedGroups, memo: raw.memo || '',
      soloGroups: soloGroups, pinOrder: pinOrder,
      board: parseBoardTokens(raw.board || raw.boardOrder)
    };
    syncBoard(out);
    return out;
  }

  /* ---------------------------------------------------------------- save */
  var saveSoon = debounce(function () { doSave(); }, 400);

  function scheduleSave() {
    if (state.demo) { paintStatus(); return; }
    state.dirty = true;
    setSave('saving');
    writeCache(state.data);
    saveSoon();
  }

  /** 화면 상태를 바꾼 직후 호출: 보기 모드는 자동 저장, 편집 모드는 완료 때 한 번에 저장. */
  function changed() {
    if (state.edit) {
      state.editDirty = true;
      paintStatus();
      renderEditBar();
      return;
    }
    if (state.demo) { paintStatus(); return; }
    scheduleSave();
  }

  /** 시트·캐시로 보낼 카테고리 목록 — 단독 페이지 폴더는 예약 이름(__solo)으로 함께 넣습니다. */
  /** 예약 목록(단독 페이지 폴더·즐겨찾기 순서)을 시트 카테고리 칸에 넣을 수 있게 한 덩어리로.
   *  카테고리 칸은 쉼표·파이프·세미콜론으로 나뉘므로, 폴더 이름에 그런 글자가 있어도
   *  깨지지 않도록 base64(URL 안전) 한 조각으로 담습니다. */
  function encodeListBlob(list) { return b64encode(JSON.stringify(list || [])); }
  function decodeListBlob(s) {
    var str = String(s || '').trim();
    if (!str) return null;
    var txt = b64decode(str);
    if (!txt) return null;
    try {
      var v = JSON.parse(txt);
      return Array.isArray(v) ? v : null;
    } catch (e) { return null; }
  }

  function categoriesForWire(d) {
    var out = (d.cats || []).map(function (c) {
      return { name: c.name, color: c.color, groups: (c.groups || []).slice() };
    });
    var sg = (d.soloGroups || []).filter(function (g) { return !!String(g).trim(); });
    if (sg.length) out.push({ name: SOLO_KEY, color: '#000000', groups: [encodeListBlob(sg)] });
    var pins = prunePinOrder();
    if (pins.length) out.push({ name: PIN_KEY, color: '#000000', groups: [encodeListBlob(pins)] });
    return out;
  }

  function payloadOf(d) {
    var links = d.links.map(function (l) {
      return { c: l.cat, g: l.group || '', n: l.name, i: l.icon, u: l.url, d: l.desc, p: l.pin ? 'Y' : 'N' };
    });
    var p = {
      action: 'saveAll',
      portalTitle: d.title,
      theme: d.theme,
      categories: categoriesForWire(d),
      collapsed: d.collapsed || [],
      collapsedGroups: d.collapsedGroups || [],
      boardOrder: (syncBoard(d) || []).join('\n'),
      links: links
    };
    if (!links.length && state.clearAllowed) p.clear = true;
    return p;
  }

  function doSave() {
    if (state.demo) { paintStatus(); return; }
    if (!state.dirty) return;
    if (state.inFlight) { state.again = true; return; }
    if (!state.data) return;

    var payload = payloadOf(state.data);
    state.inFlight = true;
    state.dirty = false;
    setSave('saving');

    saveRemote(payload).then(function () {
      state.inFlight = false;
      state.clearAllowed = false;
      state.save = 'saved';
      paintStatus();
      writeCache(state.data);
      setTimeout(function () {
        if (!state.dirty && !state.inFlight && state.save === 'saved') { state.save = 'idle'; paintStatus(); }
      }, 2600);
      if (state.again) { state.again = false; if (state.dirty) doSave(); }
    }).catch(function (err) {
      state.inFlight = false;
      state.dirty = true;
      setSave('error');
      toast('저장하지 못했습니다: ' + err.message, true);
    });
  }

  function setSave(kind) { state.save = kind; paintStatus(); }
  function setSync(kind) { state.sync = kind; paintStatus(); }

  function paintStatus() {
    var el = $('#status');
    if (!el) return;
    var kind = 'idle', text = '자동 저장';
    if (state.demo) { kind = 'idle'; text = '데모 · 저장 안 됨'; }
    else if (state.edit) { kind = 'editing'; text = state.editDirty ? '편집 중 · 변경됨' : '편집 중'; }
    else if (state.save === 'error') { kind = 'error'; text = '저장 실패 · 다시 시도'; }
    else if (state.save === 'saving' || state.inFlight) { kind = 'saving'; text = '저장 중…'; }
    else if (state.save === 'saved') { kind = 'saved'; text = '저장됨 ✓'; }
    else if (state.sync === 'syncing') { kind = 'syncing'; text = '동기화 중…'; }
    el.className = 'status ' + kind;
    var t = el.querySelector('.txt');
    if (t) t.textContent = text;
    el.onclick = kind === 'error' ? function () { state.dirty = true; doSave(); } : null;
  }

  /* ---------------------------------------------------------------- render */
  function renderSkeleton() {
    document.body.classList.remove('disconnected');
    document.body.classList.remove('editing');
    $('#editBar').innerHTML = '';
    $('#bannerWrap').innerHTML = '';
    $('#foot').innerHTML = '';
    var h = '<div class="sk-grid">';
    for (var i = 0; i < 8; i++) {
      h += '<div class="sk"><i class="t"></i><i style="width:88%"></i><i style="width:74%"></i><i style="width:82%"></i><i style="width:64%"></i></div>';
    }
    h += '</div>';
    $('#root').innerHTML = h;
  }

  function renderAll() {
    if (!state.data) return;
    var d = state.data;
    document.title = d.title || '나만의 포털';
    $('#portalTitle').textContent = d.title || '나만의 포털';
    document.documentElement.setAttribute('data-theme', d.theme || 'auto');
    document.body.classList.remove('disconnected');
    document.body.classList.toggle('editing', !!state.edit);
    $('#btnEdit').classList.toggle('hidden', !!state.edit);
    renderEditBar();
    renderBanner();
    if (state.query.trim()) renderResults(); else renderBoard();
    renderFoot();
    paintStatus();
    updateFoldBtn();
  }

  function renderEditBar() {
    var w = $('#editBar');
    if (!state.edit) { w.innerHTML = ''; return; }
    w.innerHTML =
      '<div class="editbar"><div class="eb-in">' +
      '<span class="eb-ico">✏️</span>' +
      '<div class="eb-txt"><b>편집 중</b> — 여기서는 마음껏 바꿔도 시트에 바로 저장되지 않습니다.' +
      '<span class="eb-sub">' + (state.editDirty
        ? '변경사항이 있습니다. <b>완료</b>를 눌러야 시트에 저장됩니다.'
        : '카드를 끌어 배치를 바꾸고, 🗑 삭제·✏️ 수정을 하세요. 카테고리 밖으로 끌면 단독 페이지가 됩니다.') + '</span></div>' +
      '<div class="eb-act">' +
      '<button class="btn" id="ebCancel">↩ 취소 (원래대로)</button>' +
      '<button class="btn primary" id="ebDone">✓ 완료</button>' +
      '</div></div></div>';
    $('#ebCancel').onclick = cancelEdit;
    $('#ebDone').onclick = finishEdit;
  }

  function renderBanner() {
    var wrap = $('#bannerWrap');
    if (!state.banner || state.demo) { wrap.innerHTML = ''; return; }
    wrap.innerHTML =
      '<div class="banner">' +
      '<span>⭐</span><div class="b-txt">이 주소를 <b>브라우저 북마크 맨 앞</b>에 <code>🏠포털</code>로 저장해 두세요. ' +
      '공용 PC를 껐다 켜도 로그인만 하면 그대로 열립니다.</div>' +
      '<button class="btn sm" id="bCopy">주소 복사</button>' +
      '<button class="btn sm ghost" id="bClose">닫기</button>' +
      '</div>';
    $('#bCopy').onclick = function () {
      var u = location.href;
      if (navigator.clipboard) navigator.clipboard.writeText(u).then(function () { toast('주소를 복사했습니다'); }, fallbackCopy);
      else fallbackCopy();
      function fallbackCopy() {
        var t = document.createElement('textarea'); t.value = u; document.body.appendChild(t); t.select();
        try { document.execCommand('copy'); toast('주소를 복사했습니다'); } catch (e) {}
        document.body.removeChild(t);
      }
    };
    $('#bClose').onclick = function () { state.banner = false; lsSet(LS.banner, '1'); renderBanner(); };
  }

  function catColor(name) {
    var c = (state.data.cats || []).filter(function (x) { return x.name === name; })[0];
    return (c && c.color) || 'var(--acc)';
  }

  function renderBoard() {
    var d = state.data;
    var root = $('#root');
    syncBoard(d);
    if (state.tab && state.tab.indexOf('__') !== 0 && !catByName(state.tab)) state.tab = '';
    var tab = state.tab || '';

    if (!d.links.length && !d.cats.length) {
      root.innerHTML = '<div class="card-lg empty" style="margin:24px auto">' +
        '<div class="big">🗂️</div><h3>아직 링크가 없습니다</h3>' +
        '<p>링크를 하나씩 추가하거나, 브라우저에서 내보낸 북마크 HTML을 통째로 가져올 수 있어요.</p>' +
        '<div class="btns">' +
        '<button class="btn primary" id="emptyAdd">＋ 첫 링크 추가</button>' +
        '<button class="btn" id="emptyImport">📥 북마크 HTML 가져오기</button>' +
        (state.demo ? '' : '<button class="btn" id="emptySheet">▦ 시트 열기</button>') +
        '</div></div>';
      if ($('#emptyAdd')) $('#emptyAdd').onclick = function () { openLinkModal(null, null); };
      if ($('#emptyImport')) $('#emptyImport').onclick = pickFile;
      if ($('#emptySheet')) $('#emptySheet').onclick = openSheet;
      return;
    }

    var solos = soloLinks();
    var soloFolders = childGroups('', '');
    var html = '<div class="surface" id="surface">';
    html += tabsHtml();

    if (!tab || tab === '__solo') {
      if (solos.length || soloFolders.length || tab === '__solo' || state.edit) html += soloAreaHtml();
    }

    html += '<div class="board' + (tab ? ' only' : '') + '" id="grid">';
    if (tab === '__pin') {
      html += pinPanelHtml();
    } else if (tab === '__solo') {
      /* 단독 페이지 탭: 위의 단독 영역(soloAreaHtml)이 비었으면 안내 문구를 거기에 보여 줍니다. */
    } else if (tab) {
      var only = catByName(tab);
      if (only) html += panelHtml(only);
    } else {
      d.cats.forEach(function (c) { html += panelHtml(c); });
      if (state.edit) html += '<button class="addcat-tile" data-act="addcat">＋ 새 카테고리</button>';
    }
    html += '</div></div>';
    root.innerHTML = html;
  }

  /** 알약형 탭: 전체 · 즐겨찾기 · 단독 페이지 · 각 카테고리 */
  function tabsHtml() {
    var d = state.data, tab = state.tab || '';
    var pins = pinEntries().length;
    var solos = soloLinks().length + childGroups('', '').length;
    var h = '<div class="tabs" id="tabs">';
    h += tabBtn('', '전체', !tab);
    if (pins) h += tabBtn('__pin', '📌 즐겨찾기', tab === '__pin');
    h += tabBtn('__solo', '⚡ 단독 페이지', tab === '__solo');
    d.cats.forEach(function (c) { h += tabBtn(c.name, c.name, tab === c.name); });
    return h + '</div>';
  }

  function tabBtn(key, label, on) {
    return '<button class="tab' + (on ? ' on' : '') + '" data-tab="' + esc(key) + '" type="button">' + esc(label) + '</button>';
  }

  /** 저장된 순서(board 토큰)대로 카테고리 밖 단독 페이지 목록. */
  function soloLinks() {
    var out = [];
    if (!state.data) return out;
    (state.data.board || []).forEach(function (t) {
      if (String(t).indexOf('s:') !== 0) return;
      var l = soloLinkByKey(String(t).slice(2));
      if (l) out.push(l);
    });
    return out;
  }

  /* ---------------------------------------------------------------- 즐겨찾기
     타일 하나(pin)뿐 아니라 폴더·카테고리 통째로도 즐겨찾기에 고정합니다.
     즐겨찾기 탭의 순서는 pinOrder 토큰 목록으로 기억합니다.
       l:<url 해시> / f:<카테고리>»<폴더 경로> / c:<카테고리>
     이 목록은 시트 「카테고리」 설정에 예약 이름(__pins)으로 함께 저장됩니다. */
  var PIN_KEY = '__pins';
  function pinOrderArr() {
    if (!state.data) return [];
    if (!Array.isArray(state.data.pinOrder)) state.data.pinOrder = [];
    return state.data.pinOrder;
  }
  function pinLinkToken(l) { return 'l:' + hashKey(normKey(l && l.url)); }
  function pinFolderToken(cat, g) { return 'f:' + (cat || '') + '»' + String(g || ''); }
  function pinCatToken(cat) { return 'c:' + String(cat || ''); }

  function linkByPinToken(tok) {
    var key = String(tok || '').slice(2);
    var arr = (state.data && state.data.links) || [];
    for (var i = 0; i < arr.length; i++) if (hashKey(normKey(arr[i].url)) === key) return arr[i];
    return null;
  }

  /** 토큰 하나를 지금 데이터에서 풀어 봅니다(없는 것은 null). */
  function resolvePinToken(tok) {
    tok = String(tok || '');
    if (tok.indexOf('l:') === 0) {
      var l = linkByPinToken(tok);
      return l && l.pin ? { type: 'link', token: tok, link: l } : null;
    }
    if (tok.indexOf('f:') === 0) {
      var rest = tok.slice(2), i = rest.indexOf('»');
      var cat = i < 0 ? '' : rest.slice(0, i);
      var g = i < 0 ? rest : rest.slice(i + 1);
      if (!g) return null;
      if (cat && !catByName(cat)) return null;
      if (groupsOf(cat).indexOf(g) < 0) return null;
      return { type: 'folder', token: tok, cat: cat, group: g };
    }
    if (tok.indexOf('c:') === 0) {
      var nm = tok.slice(2);
      return nm && catByName(nm) ? { type: 'cat', token: tok, cat: nm } : null;
    }
    return null;
  }

  /** 즐겨찾기 탭에 보일 항목들 — 저장된 순서 → 빠진 즐겨찾기 링크 순. */
  function pinEntries() {
    var out = [], seen = {};
    pinOrderArr().forEach(function (t) {
      t = String(t || '').trim();
      if (!t || seen[t]) return;
      var e = resolvePinToken(t);
      if (!e) return;
      seen[t] = 1; out.push(e);
    });
    state.data.links.forEach(function (l) {
      if (!l.pin) return;
      var t = pinLinkToken(l);
      if (seen[t]) return;
      seen[t] = 1; out.push({ type: 'link', token: t, link: l });
    });
    return out;
  }

  /** 지금 데이터에 실재하는 토큰만 순서대로 남깁니다(저장·캐시 전 정리). */
  function prunePinOrder() {
    var list = pinEntries().map(function (e) { return e.token; });
    if (state.data) state.data.pinOrder = list;
    return list;
  }

  function isFolderPinned(cat, g) { return pinOrderArr().indexOf(pinFolderToken(cat, g)) >= 0; }
  function isCatPinned(cat) { return pinOrderArr().indexOf(pinCatToken(cat)) >= 0; }

  /** 즐겨찾기 항목 하나를 다른 항목 앞으로 옮깁니다. beforeTok이 null이면 맨 뒤로. */
  function movePinEntry(tok, beforeTok) {
    if (!tok || tok === beforeTok) return { ok: false };
    var e = resolvePinToken(tok);
    if (!e) return { ok: false };
    var arr = pinOrderArr();
    var i = arr.indexOf(tok);
    if (i >= 0) arr.splice(i, 1);
    var at = beforeTok ? arr.indexOf(beforeTok) : -1;
    if (at < 0) at = arr.length;
    arr.splice(at, 0, tok);
    return { ok: true, entry: e };
  }

  /** 폴더·카테고리 즐겨찾기 토글 */
  function toggleFolderPin(cat, g) {
    if (!state.data) return;
    var tok = pinFolderToken(cat, g);
    var arr = pinOrderArr();
    var i = arr.indexOf(tok);
    if (i >= 0) arr.splice(i, 1); else arr.push(tok);
    renderAll();
    changed();
    toast(i >= 0 ? '📌 “' + leafOf(g) + '” 폴더 즐겨찾기를 해제했습니다' : '📌 “' + leafOf(g) + '” 폴더를 즐겨찾기에 넣었습니다');
  }

  function toggleCatPin(cat) {
    if (!state.data) return;
    var tok = pinCatToken(cat);
    var arr = pinOrderArr();
    var i = arr.indexOf(tok);
    if (i >= 0) arr.splice(i, 1); else arr.push(tok);
    renderAll();
    changed();
    toast(i >= 0 ? '📌 “' + cat + '” 카테고리 즐겨찾기를 해제했습니다' : '📌 “' + cat + '” 카테고리 전체를 즐겨찾기에 넣었습니다');
  }

  /** 즐겨찾기 항목이 담고 있는 링크 전부(모두 열기에 쓸 목록) */
  function pinLinksOf(e) {
    if (!e) return [];
    if (e.type === 'link') return e.link ? [e.link] : [];
    if (e.type === 'folder') return state.data.links.filter(function (l) { return (l.cat || '') === e.cat && pathUnder(l.group || '', e.group); });
    if (e.type === 'cat') return state.data.links.filter(function (l) { return l.cat === e.cat; });
    return [];
  }

  function pinAllLinks() {
    var out = [];
    pinEntries().forEach(function (e) { out = out.concat(pinLinksOf(e)); });
    return out;
  }

  /** 즐겨찾기 탭에서 접힌 항목(보기 상태만 · 저장하지 않음) */
  function isPinCollapsed(tok) { return !!(state.pinCollapsed && state.pinCollapsed[tok]); }
  function togglePinCollapsed(tok) {
    if (!state.pinCollapsed) state.pinCollapsed = {};
    if (state.pinCollapsed[tok]) delete state.pinCollapsed[tok]; else state.pinCollapsed[tok] = 1;
    var el = $('.pin-panel [data-pin-token="' + cssEsc(tok) + '"]');
    if (el) {
      el.classList.toggle('is-collapsed', !!state.pinCollapsed[tok]);
      var ch = el.querySelector('.gchev-btn');
      if (ch) { ch.textContent = state.pinCollapsed[tok] ? '▸' : '▾'; ch.setAttribute('aria-expanded', state.pinCollapsed[tok] ? 'false' : 'true'); }
    }
  }

  /** 즐겨찾기에 고정된 카테고리 하나 — 안의 링크·폴더를 그대로 펼쳐 보여줍니다. */
  function pinCatHtml(cat) {
    var c = catByName(cat);
    if (!c) return '';
    var tok = pinCatToken(cat);
    var items = state.data.links.filter(function (l) { return l.cat === cat; });
    var collapsed = isPinCollapsed(tok);
    var h = '<div class="grp pin-cat" data-pin-token="' + esc(tok) + '" data-cat="' + esc(cat) + '" data-group="" data-depth="1" style="--c:' + esc(c.color || 'var(--acc)') + '">';
    h += '<div class="grp-head" data-act="pin-fold" title="' + esc(cat) + '\n접기 / 펼치기 · 끌어서 즐겨찾기 순서 바꾸기">' +
      '<button class="gchev-btn" data-act="pin-fold" aria-expanded="' + (collapsed ? 'false' : 'true') + '" title="접기 / 펼치기">' + (collapsed ? '▸' : '▾') + '</button>' +
      '<span class="gname">📂 ' + esc(cat) + '</span>' +
      '<span class="gcnt">' + items.length + '</span>' +
      '<button class="gbtn gopen" data-act="pin-open" title="이 카테고리의 링크를 모두 새 탭에서 열기">↗</button>' +
      '<button class="gbtn del" data-act="pin-cat" title="카테고리 즐겨찾기 해제">📌</button>' +
      '</div>';
    h += '<div class="grp-body">';
    items.filter(function (l) { return !l.group; }).forEach(function (l) { h += chipHtml(l); });
    childGroups(cat, '').forEach(function (g) {
      h += groupHtml(c, g, items.filter(function (l) { return l.group === g; }), 2);
    });
    h += '</div></div>';
    return h;
  }

  function pinEntryHtml(e) {
    if (e.type === 'link') return chipHtml(e.link, e.token);
    if (e.type === 'folder') {
      var c = e.cat ? catByName(e.cat) : { name: '', color: 'var(--acc)' };
      if (!c) return '';
      var gl = state.data.links.filter(function (l) { return (l.cat || '') === e.cat && l.group === e.group; });
      return groupHtml(c, e.group, gl, 1, e.token);
    }
    if (e.type === 'cat') return pinCatHtml(e.cat);
    return '';
  }

  /** 즐겨찾기만 모아 보는 탭. */
  function pinPanelHtml() {
    var entries = pinEntries();
    var h = '<section class="panel pin-panel" data-cat="" data-pin="1" style="--c:var(--acc)">' +
      '<div class="ph"><h2>📌 즐겨찾기</h2><span class="cnt">' + entries.length + '</span>' +
      '<span class="ph-sp"></span>' +
      '<button class="open-mini" data-act="open-all-pins" title="즐겨찾기를 모두 새 탭에서 열기">↗</button></div>';
    h += '<div class="plist">';
    if (!entries.length && !state.edit) {
      h += '<div class="empty-msg">즐겨찾기한 타일·폴더가 없습니다. 타일이나 폴더 머리에서 오른쪽 버튼 → 📌 즐겨찾기로 고정하세요.</div>';
    }
    entries.forEach(function (e) { h += pinEntryHtml(e); });
    h += '</div></section>';
    return h;
  }

  /** URL의 실제 파비콘. 사용자가 직접 고른 이모지는 그대로 씁니다. */
  function favUrl(url) {
    var h = hostOf(url);
    if (!h || h === '링크') return '';
    return 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(h) + '&sz=64';
  }

  /** 사용자가 넣은 이미지 아이콘인지 (이미지 주소 / 직접 넣은 이미지 data URL) */
  function isImageIcon(v) { return /^(https?:\/\/|data:image\/)/i.test(String(v || '').trim()); }

  /** 자동 아이콘인지(사용자가 직접 고른 이모지·이미지가 아닌지) */
  function autoIcon(l) {
    var ic = String(l.icon || '').trim();
    if (!ic || ic === AUTO_ICON) return true;
    if (isImageIcon(ic)) return false;
    /* 예전에 자동으로 붙었던 아이콘(지금 규칙으로 추측한 값과 같은 것)도 자동으로 봅니다. */
    return ic === guessIcon(l.url, l.name);
  }

  /** 타일에 보일 아이콘 글자 — 사용자가 고른 이모지 → 키워드 자동 매칭 */
  function displayIcon(l) {
    if (isImageIcon(l.icon)) return guessIcon(l.url, l.name);
    if (!autoIcon(l)) return l.icon;
    return guessIcon(l.url, l.name);
  }

  /** 아이콘 박스 안쪽 — 이미지 아이콘은 파비콘·이모지보다 먼저, 실패하면 키워드 이모지로 폴백. */
  function iconInner(l) {
    var ic = String(l.icon || '').trim();
    if (isImageIcon(ic)) {
      return '<span class="em on">' + esc(guessIcon(l.url, l.name)) + '</span>' +
        '<img class="fv uv" src="' + esc(ic) + '" alt="" decoding="async" ' +
        'onload="this.classList.add(\'on\')" onerror="this.remove()">';
    }
    var plan = autoIcon(l) ? autoBadgePlan(l) : null;
    if (plan) {
      /* 제목 맞춤 배지를 메인으로, 원 사이트 파비콘은 오른쪽 아래 작은 배지로만 */
      var bh = '<span class="em on">' + esc(plan.emoji) + '</span>' +
        '<img class="fv uv" src="' + esc(plan.src) + '" alt="" decoding="async" ' +
        'onload="this.classList.add(\'on\')" onerror="this.remove()">';
      if (plan.brand) bh += '<span class="bdg"><img src="' + esc(plan.brand) + '" alt="" onerror="this.parentNode.remove()"></span>';
      return bh;
    }
    var em = esc(displayIcon(l));
    var src = (autoIcon(l) && /^https?:/i.test(l.url)) ? favUrl(l.url) : '';
    var out = '<span class="em on">' + em + '</span>';
    if (src) {
      /* 폴백을 먼저 깔아 두고, 파비콘이 정상 로드(16px 이상)일 때만 위에 겹칩니다. */
      out += '<img class="fv" src="' + esc(src) + '" alt="" decoding="async" ' +
        'onload="if(this.naturalWidth>=16){this.classList.add(\'on\')}else{this.remove()}" ' +
        'onerror="this.remove()">';
    }
    return out;
  }

  function iconHtml(l) {
    return '<span class="ico">' + iconInner(l) + '</span>';
  }

  function ctoolsHtml(l) {
    if (!state.edit) return '';
    return '<div class="ctools">' +
      '<button type="button" data-act="pin" class="' + (l.pin ? 'on' : '') + '" title="상단 고정">📌</button>' +
      '<button type="button" data-act="edit" title="수정">✏️</button>' +
      '<button type="button" data-act="del" class="del" title="삭제">🗑</button>' +
      '</div>';
  }

  /** 카테고리 밖 단독 페이지 타일 — 카테고리 박스 없이 첫 화면 위쪽에 놓입니다. */
  function soloHtml(l) {
    return '<div class="solo" data-id="' + l.id + '" data-solo="1" data-cat="" data-url="' + esc(l.url) + '" role="link" tabindex="0" ' +
      'title="' + esc(l.name + (l.desc ? ' — ' + l.desc : '') + '\n카테고리 밖 단독 페이지\n' + l.url) + '">' +
      iconHtml(l) +
      '<span class="nm">' + esc(l.name) + '</span>' +
      ctoolsHtml(l) +
      '</div>';
  }

  /** 단독 페이지 영역 — 카테고리 박스 없이 첫 화면 위쪽에 놓입니다.
   *  폴더(group)도 카테고리 안 폴더와 같은 모양으로, 하위 폴더까지 그립니다. */
  function soloAreaHtml() {
    var solos = soloLinks();
    var rootTiles = solos.filter(function (l) { return !l.group; });
    var folders = childGroups('', '');
    var c = { name: '', color: 'var(--acc)' };
    var h = '<div class="solo-strip' + (state.tab ? '' : ' has-cats') + (folders.length ? ' has-folders' : '') + '" id="soloArea">';
    if (!rootTiles.length && !folders.length) {
      h += '<div class="empty-msg">카테고리 밖 단독 페이지가 없습니다. 이 영역의 빈 곳에서 <b>오른쪽 버튼 → 📁 새 폴더 만들기</b>로 폴더를 만들거나, 편집에서 링크의 카테고리를 “(없음 · 단독 페이지)”로 고르세요.</div>';
    }
    rootTiles.forEach(function (l) { h += soloHtml(l); });
    folders.forEach(function (g) {
      h += groupHtml(c, g, solos.filter(function (l) { return l.group === g; }), 1);
    });
    if (state.edit) h += '<button class="add-group" data-act="g-add-solo">＋ 폴더</button>';
    h += '</div>';
    return h;
  }

  function panelHtml(c) {
    var items = state.data.links.filter(function (l) { return l.cat === c.name; });
    var collapsed = isCatCollapsed(c.name);
    var gs = groupsOf(c.name);
    var chev = collapsed ? '▸' : '▾';
    var h = '<section class="panel' + (collapsed ? ' is-collapsed' : '') + '" data-cat="' + esc(c.name) + '" style="--c:' + esc(c.color || 'var(--acc)') + '">';
    var openBtn = '<button class="open-mini" data-act="open-all" title="이 카테고리의 링크를 모두 새 탭에서 열기">↗</button>';

    h += '<div class="ph">' +
      '<button class="collapser" data-act="collapse" aria-expanded="' + (collapsed ? 'false' : 'true') + '" title="접기 / 펼치기">' + chev + '</button>';
    if (state.edit) {
      h += '<input class="cat-name" value="' + esc(c.name) + '" data-cat="' + esc(c.name) + '" aria-label="카테고리 이름" />';
    } else {
      h += '<span class="pdot"></span><h2 title="두 번 누르면 이름 바꾸기">' + esc(c.name) + '</h2>';
    }
    h += '<span class="cnt">' + items.length + '</span><span class="ph-sp"></span>' +
      ((isCatPinned(c.name) || state.edit)
        ? '<button class="open-mini pinbtn' + (isCatPinned(c.name) ? ' on' : '') + '" data-act="pin-cat" title="' + (isCatPinned(c.name) ? '카테고리 즐겨찾기 해제' : '이 카테고리 통째로 즐겨찾기') + '">📌</button>'
        : '') +
      openBtn +
      '<span class="cat-grip" title="끌어서 카테고리 순서 바꾸기">⠿</span></div>';

    if (state.edit) {
      h += '<div class="ed-head"><div class="dots">' +
        COLORS.map(function (col) {
          return '<button type="button" data-color="' + col + '" style="--dc:' + col + '" class="' + (col === c.color ? 'on' : '') + '" title="' + col + '"></button>';
        }).join('') +
        '</div><span class="spacer"></span>' +
        '<button class="mini" data-act="add-here" title="이 카테고리에 링크 추가">＋ 링크</button>' +
        '<button class="mini danger" data-act="cat-del" title="이 카테고리 삭제">🗑</button></div>';
    }

    h += '<div class="plist">';
    if (!items.length && !gs.length) {
      h += '<div class="empty-msg">' + (state.edit ? '여기로 링크를 끌어다 놓으세요' : '아직 링크가 없습니다') + '</div>';
    } else {
      items.filter(function (l) { return !l.group; }).forEach(function (l) { h += chipHtml(l); });
      childGroups(c.name, '').forEach(function (g) {
        h += groupHtml(c, g, items.filter(function (l) { return l.group === g; }), 1);
      });
    }
    h += '</div>';
    if (state.edit) h += '<button class="add-group" data-act="g-add">＋ 소그룹</button>';
    h += '</section>';
    return h;
  }

  /** 카테고리 안의 소그룹 순서: 카테고리에 저장된 순서 → 링크에만 있는 소그룹. */
  /* 폴더 경로: '재테크/환율' 처럼 '/'로 깊이를 표현합니다. */
  function dirOf(path) { var p = String(path || ''); var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
  function leafOf(path) { var p = String(path || ''); var i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
  function joinPath(parent, name) { return parent ? parent + '/' + name : String(name || ''); }
  function pathUnder(p, prefix) { return p === prefix || String(p).indexOf(prefix + '/') === 0; }
  function cleanLeaf(name) { return String(name == null ? '' : name).replace(/[\/]+/g, '·').replace(/^\s+|\s+$/g, ''); }

  /** 카테고리의 모든 폴더 경로(상위 폴더 포함), 저장된 순서대로.
   *  catName 이 '' 이면 카테고리 밖 「단독 페이지」 영역의 폴더들입니다. */
  function groupsOf(catName) {
    var out = [];
    if (!catName) {
      soloGroupsStore().forEach(function (g) { pushPath(out, g); });
      state.data.links.forEach(function (l) { if (isSolo(l) && l.group) pushPath(out, l.group); });
      return out;
    }
    var c = state.data.cats.filter(function (x) { return x.name === catName; })[0];
