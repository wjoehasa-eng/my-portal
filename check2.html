<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<title>삽입선 미리보기 (임시)</title>
<style>
  body { font: 13px/1.45 system-ui, sans-serif; margin: 0; padding: 8px; background: #101418; color: #e6edf3; }
  iframe { width: 1180px; height: 900px; border: 1px solid #333; background: #fff; }
  pre { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="f" src="./?demo=1"></iframe>
<pre id="out">드래그 준비…</pre>
<script>
const F = document.getElementById('f');
const OUT = document.getElementById('out');
const D = () => F.contentDocument;
const W = () => F.contentWindow;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function tile(name) {
  return Array.from(D().querySelectorAll('.solo, .lk')).find(t => {
    const nm = t.querySelector('.nm');
    return nm && nm.textContent.trim() === name;
  }) || null;
}
function pev(type, x, y) {
  return new (W().PointerEvent)(type, {
    bubbles: true, cancelable: true, composed: true,
    clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse', isPrimary: true,
    button: 0, buttons: 1
  });
}
function fire(type, x, y) {
  const el = D().elementFromPoint(x, y) || D().body;
  el.dispatchEvent(pev(type, x, y));
}
F.addEventListener('load', async () => {
  await sleep(500);
  const src = tile('노션');
  const dst = tile('챗봇');
  const r = src.getBoundingClientRect();
  const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
  const t = dst.getBoundingClientRect();
  const tx = t.left + t.width * 0.2, ty = t.top + t.height * 0.5;
  fire('pointerdown', sx, sy);
  await sleep(30);
  fire('pointermove', sx + 10, sy + 2);
  await sleep(30);
  for (let i = 1; i <= 8; i++) { fire('pointermove', sx + (tx - sx) * i / 8, sy + (ty - sy) * i / 8); await sleep(20); }
  const b = D().querySelector('#dropBadge');
  const l = D().querySelector('#dropLine');
  OUT.textContent = 'badge=' + (b && b.textContent) + ' | line=' + (l && l.className) + ' | shown=' + (l && l.style.display)
    + ' | ghost=' + !!D().querySelector('.drag-ghost');
  document.title = 'paused';
});
</script>
</body>
</html>
