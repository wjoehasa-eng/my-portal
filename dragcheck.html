<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>drag check</title>
<style>body{font:13px/1.5 monospace;padding:16px}pre{white-space:pre-wrap}iframe{width:1280px;height:900px;border:1px solid #ccc}</style>
</head><body>
<h1>드래그 자동 점검 v2 (임시 페이지)</h1>
<pre id="out">준비 중…</pre>
<iframe id="f" src="index.html?demo=1"></iframe>
<script>
var out = document.getElementById('out');
var log = [];
function say(s) { log.push(s); out.textContent = log.join('\n'); }
function clean(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }

function pe(win, type, x, y, target, buttons) {
  var e = new win.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true,
    clientX: x, clientY: y, pointerId: 1, pointerType: 'mouse',
    button: 0, buttons: buttons === undefined ? (type === 'pointerup' ? 0 : 1) : buttons, isPrimary: true
  });
  (target || win).dispatchEvent(e);
  return e;
}
function byName(doc, name) {
  var l = doc.querySelectorAll('.lk, .solo');
  for (var i = 0; i < l.length; i++) {
    var n = l[i].querySelector('.nm');
    if (n && clean(n.textContent) === name) return l[i];
  }
  return null;
}
function ctr(el) { var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r }; }

function drag(win, doc, fromEl, tx, ty) {
  var c = ctr(fromEl), badge = [];
  pe(win, 'pointerdown', c.x, c.y, fromEl);
  var steps = 10;
  for (var i = 1; i <= steps; i++) {
    pe(win, 'pointermove', c.x + (tx - c.x) * i / steps, c.y + (ty - c.y) * i / steps, win);
    if (i === 4 || i === 8) {
      var b = doc.querySelector('#dropBadge');
      badge.push(clean(b ? b.textContent : '') + '|' + clean(doc.querySelector('html').className));
    }
  }
  var badgeTxt = badge.join(' / ');
  pe(win, 'pointerup', tx, ty, win);
  return badgeTxt;
}

function snap(win, doc) {
  var solos = [], cats = [];
  doc.querySelectorAll('.solo .nm').forEach(function (n) { solos.push(clean(n.textContent)); });
  doc.querySelectorAll('.panel').forEach(function (p) {
    var c = p.querySelector('.ph .cnt');
    cats.push((p.dataset.cat || '(pin)') + ':' + (c ? clean(c.textContent) : '?'));
  });
  var t = doc.querySelectorAll('#toasts .toast');
  var toasts = [];
  t.forEach(function (x) { toasts.push(clean(x.textContent)); });
  return { solos: solos, cats: cats, toasts: toasts };
}

var step = 0;
function go() {
  var f = document.getElementById('f'), win = f.contentWindow, doc = f.contentDocument;
  if (!win || !doc || !doc.querySelector('.surface')) { setTimeout(go, 500); return; }

  if (step === 0) {
    say('0 시작 ' + JSON.stringify(snap(win, doc)));
    var yt = byName(doc, '유튜브'), solo = byName(doc, '구글 캘린더');
    var b = drag(win, doc, yt, ctr(solo).x, solo.getBoundingClientRect().top + 6);
    say('A 링크→단독(앞) 배지[' + b + '] ' + JSON.stringify(snap(win, doc)));
  } else if (step === 1) {
    var s1 = byName(doc, '유튜브'), s2 = byName(doc, '구글 캘린더');
    var r2 = s2.getBoundingClientRect();
    var b = drag(win, doc, s1, r2.left + r2.width / 2, r2.bottom - 6);
    say('E 단독끼리 순서 배지[' + b + '] ' + JSON.stringify(snap(win, doc)));
  } else if (step === 2) {
    var grip = doc.querySelector('.panel[data-cat="업무"] .cat-grip');
    var tgt = doc.querySelector('.panel[data-cat="도구"] .ph');
    var tr = tgt.getBoundingClientRect();
    var b = drag(win, doc, grip, tr.left + tr.width / 2, tr.top + 6);
    say('B 카테고리 순서 배지[' + b + '] ' + JSON.stringify(snap(win, doc)));
  } else if (step === 3) {
    var soloEl = byName(doc, '구글 캘린더') || doc.querySelector('.solo');
    var tile = doc.querySelector('.panel .plist .lk');
    var tc = ctr(tile);
    var b = drag(win, doc, soloEl, tc.x, tc.y);
    say('C 단독→카테고리 배지[' + b + '] ' + JSON.stringify(snap(win, doc)));
  } else if (step === 4) {
    var col = doc.querySelector('.panel .collapser');
    var name = doc.querySelector('.panel').dataset.cat;
    col.click();
    var collapsedNow = doc.querySelector('.panel').classList.contains('is-collapsed');
    var visTiles = doc.querySelectorAll('.panel .plist .lk').length;
    doc.querySelector('.panel .collapser').click();
    var reopened = !doc.querySelector('.panel').classList.contains('is-collapsed');
    say('D 접기[' + name + '] collapsed=' + collapsedNow + ' tileTags=' + visTiles + ' reopened=' + reopened);
    var foldBtn = doc.querySelector('#btnFold');
    foldBtn.click();
    var allCollapsed = doc.querySelectorAll('.panel.is-collapsed').length + '/' + doc.querySelectorAll('.panel').length;
    say('F 모두 접기 ' + allCollapsed + ' | ' + clean(foldBtn.textContent));
    foldBtn.click();
    say('G 모두 펼치기 ' + doc.querySelectorAll('.panel.is-collapsed').length + ' | ' + clean(foldBtn.textContent));
    say('== 끝 ==');
  }
  step++;
  if (step <= 4) setTimeout(go, 450);
}
setTimeout(go, 1400);
</script>
</body></html>
