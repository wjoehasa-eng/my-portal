<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>즐겨찾기 순서 자기 점검 · 나만의 포털</title>
<style>
  body{font:14px/1.6 -apple-system,"Segoe UI",Roboto,"맑은 고딕",sans-serif;margin:0;padding:20px;background:#f6f7fb;color:#1b2430}
  h1{font-size:17px;margin:0 0 6px}
  p.lead{margin:0 0 14px;color:#5a6472}
  #sum{font-weight:700;padding:10px 14px;border-radius:10px;background:#eef2ff;margin:0 0 14px}
  #sum.ok{background:#e8f7ee;color:#12692f}
  #sum.bad{background:#fdecec;color:#a11c1c}
  pre{background:#fff;border:1px solid #e2e6ef;border-radius:10px;padding:14px;white-space:pre-wrap;margin:0}
  .t{color:#12692f}.f{color:#a11c1c;font-weight:700}
</style>
</head>
<body>
<h1>즐겨찾기 순서 자기 점검</h1>
<p class="lead">index.html 안의 실제 함수(pinLinkToken · linkByPinToken · resolvePinToken · pinEntries · prunePinOrder)를
그대로 잘라 실행합니다 — 같은 URL 링크가 여럿일 때 즐겨찾기 타일이 맨 위로 옮겨지는지 확인합니다.</p>
<p id="sum">점검 중…</p>
<pre id="out"></pre>
<script>
(async function () {
  var out = document.getElementById('out'), sum = document.getElementById('sum');
  function log(s, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = s;
    out.appendChild(d);
  }
  var html;
  try {
    html = await (await fetch('../index.html', { cache: 'no-store' })).text();
  } catch (e) { sum.className = 'bad'; sum.textContent = 'index.html 을 읽지 못했습니다: ' + e.message; return; }

  var ver = (html.match(/portal-version" content="([0-9.]+)"/) || [])[1] || '?';
  log('대상: index.html v' + ver);

  var start = html.indexOf("var PIN_KEY = '__pins';");
  var end = html.indexOf('function isFolderPinned(');
  if (start < 0 || end < 0) { sum.className = 'bad'; sum.textContent = '함수를 찾지 못했습니다.'; return; }
  var src = html.slice(start, end);

  var helpers = 'function normKey(u) { return String(u || "").trim().replace(/\\/+$/, ""); }' +
    'function hashKey(s){ s = String(s || ""); var h = 5381;' +
    'for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;' +
    'return (h >>> 0).toString(36); }';
  var stubs = 'var state = { data: null }; var _zones = [];' +
    'function catByName(n){ return (state.data.cats || []).filter(function (c) { return c.name === n; })[0] || null; }' +
    'function groupsOf(cat){ var c = catByName(cat); return c ? (c.groups || []) : []; }' +
    'function favZonesStore(){ return _zones; }' +
    'function pruneFavZones(){ var inOrder = {}; (state.data.pinOrder || []).forEach(function (t) { inOrder[t] = 1; });' +
    ' var seen = {}; _zones.forEach(function (z) { var keep = []; (z.tokens || []).forEach(function (t) {' +
    ' t = String(t || ""); if (!t || !inOrder[t] || seen[t]) return; seen[t] = 1; keep.push(t); }); z.tokens = keep; }); }';
  var make;
  try {
    make = new Function(helpers + stubs + src +
      'return { pinLinkToken: pinLinkToken, linkByPinToken: linkByPinToken, resolvePinToken: resolvePinToken,' +
      ' pinEntries: pinEntries, prunePinOrder: prunePinOrder,' +
      ' setState: function (d) { state.data = d; }, setZones: function (z) { _zones = z; }, getZones: function () { return _zones; } };');
  } catch (e) { sum.className = 'bad'; sum.textContent = '함수를 읽지 못했습니다(문법 오류): ' + e.message; return; }

  var fails = 0, total = 0;
  function check(name, got, want) {
    total++;
    var ok = JSON.stringify(got) === JSON.stringify(want);
    if (ok) log('  ✓ ' + name, 't');
    else { fails++; log('  ✗ ' + name + '\n      got:  ' + JSON.stringify(got) + '\n      want: ' + JSON.stringify(want), 'f'); }
  }
  var URL_DUP = 'https://wjoehasa-eng.github.io/stock-note/#s=abc';
  function makeData(pins) {
    return {
      cats: [{ name: 'PC 북마크', groups: [] }, { name: '부장', groups: [] }],
      links: [
        { id: 'a', cat: 'PC 북마크', group: '', name: '업무포털', url: 'https://portal.go.kr', pin: !!(pins && pins.a) },
        { id: 'b', cat: 'PC 북마크', group: '', name: '자산 관리', url: URL_DUP, pin: !!(pins && pins.b) },
        { id: 'c', cat: 'PC 북마크', group: '', name: '인디스쿨', url: 'https://indischool.com', pin: !!(pins && pins.c) },
        { id: 'd', cat: 'PC 북마크', group: '', name: '자산관리', url: URL_DUP, pin: !!(pins && pins.d) }
      ],
      pinOrder: []
    };
  }
  var t = make(), base = makeData();
  t.setState(base);
  var tokA = t.pinLinkToken(base.links[0]);
  var tokB = t.pinLinkToken(base.links[1]);
  var tokC = t.pinLinkToken(base.links[2]);
  var tokD = t.pinLinkToken(base.links[3]);

  log('[1] 같은 주소 링크가 여럿일 때 토큰 구분');
  check('첫 번째 링크는 예전 형식 그대로', /^l:[0-9a-z]+$/.test(tokB), true);
  check('두 번째 같은 주소 링크는 _1 이 붙음', tokD, tokB + '_1');
  check('_1 토큰은 두 번째(자산관리)로 풀림', t.linkByPinToken(tokD).name, '자산관리');
  check('예전 형식 토큰은 첫 번째(자산 관리)로 풀림', t.linkByPinToken(tokB).name, '자산 관리');
  check('없는 토큰은 null', t.linkByPinToken('l:zzzzzz'), null);

  log('[2] 예전 저장분(l:지문 하나)만 있는 상태 — 고정한 타일이 순서 목록에서 살아나는가');
  var d = makeData({ d: true });
  d.pinOrder = [tokB, 'c:부장'];
  t.setState(d);
  var ents = t.pinEntries();
  check('예전 토큰이 고정된 자산관리로 풀리고 지금 형식 토큰으로 바뀜', ents.map(function (e) { return e.token; }), [tokD, 'c:부장']);
  check('고정 안 된 쌍둥이(자산 관리)는 즐겨찾기에 끼지 않음', ents.length, 2);
  check('정리하면 pinOrder 가 지금 형식으로 저장됨', t.prunePinOrder(), [tokD, 'c:부장']);

  log('[3] 맨 앞으로 옮기기 — 드래그 계산 그대로');
  d = makeData({ a: true, d: true });
  d.pinOrder = [tokA, 'c:부장'];
  t.setState(d);
  var list = t.prunePinOrder();
  check('드래그 전 순서(자산관리는 맨 뒤)', list, [tokA, 'c:부장', tokD]);
  var k = list.indexOf(tokD); if (k >= 0) list.splice(k, 1);
  var at = list.indexOf(tokA); if (at < 0) at = list.length;
  list.splice(at, 0, tokD);
  check('맨 앞으로 옮긴 뒤 순서', list, [tokD, tokA, 'c:부장']);

  log('[4] 새로고침 재현 — 저장된 토큰만으로 같은 화면이 다시 그려지는가');
  var saved = list.slice();
  var d2 = makeData({ a: true, d: true });
  d2.pinOrder = saved.slice();
  d2.links = d2.links.map(function (l, n) { return { id: 'new' + n, cat: l.cat, group: l.group, name: l.name, url: l.url, pin: l.pin }; });
  t.setState(d2);
  check('다시 그린 즐겨찾기 순서', t.pinEntries().map(function (e) { return e.link ? e.link.name : e.token; }), ['자산관리', '업무포털', 'c:부장']);
  check('정리해도 그대로(저장값 = 화면 순서)', t.prunePinOrder(), saved);

  log('[5] 같은 주소 두 개를 모두 고정한 경우');
  d = makeData({ b: true, d: true });
  t.setState(d);
  check('두 타일이 각각 나옴', t.pinEntries().map(function (e) { return e.link.name; }), ['자산 관리', '자산관리']);
  check('토큰도 서로 다름', t.pinEntries().map(function (e) { return e.token; }), [tokB, tokD]);

  log('[6] 즐겨찾기 구역(__fzones) 토큰도 예전 형식에서 함께 옮겨지는가');
  d = makeData({ d: true });
  d.pinOrder = [tokB];
  t.setState(d);
  t.setZones([{ id: 'z1', name: '구역', color: '', noTitle: false, tokens: [tokB] }]);
  t.prunePinOrder();
  check('구역 안 토큰이 지금 형식으로 바뀜', t.getZones()[0].tokens, [tokD]);

  log('[7] 즐겨찾기에서 빼기 — 쌍둥이 중 고정한 쪽만 가리키는가');
  d = makeData({ d: true });
  d.pinOrder = [tokD];
  t.setState(d);
  var hit = t.linkByPinToken(tokD);
  check('_1 토큰은 자산관리 한 건만 가리킴', [hit.name, hit.pin], ['자산관리', true]);
  check('쌍둥이(자산 관리)는 손대지 않음', d.links[1].pin, false);
  check('다른 링크 토큰은 다른 링크', t.linkByPinToken(tokC).name, '인디스쿨');

  if (fails) { sum.className = 'bad'; sum.textContent = '실패 ' + fails + ' / ' + total + '건'; }
  else { sum.className = 'ok'; sum.textContent = '모두 통과 (' + total + '건) · v' + ver; }
})();
</script>
</body>
</html>
